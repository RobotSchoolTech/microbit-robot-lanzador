<style>
/* ════════ Tokens RBS (copia de Design/design-system/css/tokens.css v2.0) ════════ */
:root{
  --font-display:'Sora',system-ui,-apple-system,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:ui-monospace,'Cascadia Code',Consolas,'Courier New',monospace;
  --rbs-teal:#009CCC; --rbs-teal-dark:#007aaa; --rbs-teal-light:#e0f5fb;
  --rbs-red:#E8302A; --rbs-red-dark:#c0201a; --rbs-red-light:#fde8e8;
  --rbs-orange:#F97316; --rbs-orange-dark:#EA580C; --rbs-orange-light:#FFEDE0;
  --rbs-pink:#EC4899; --rbs-pink-dark:#DB2777; --rbs-pink-light:#FCE7F3;
  --rbs-carbon:#1A1A1A; --rbs-gray-900:#111827; --rbs-gray-700:#374151; --rbs-gray-500:#6B7280;
  --rbs-gray-400:#9CA3AF; --rbs-gray-300:#D1D5DB; --rbs-gray-200:#E5E7EB; --rbs-gray-100:#F3F4F6;
  --rbs-ivory:#F0F0EB; --rbs-border:#E0DDD6; --rbs-white:#FFFFFF;
  --rbs-success:#16A34A; --rbs-success-light:#DCFCE7; --rbs-warning:#F59E0B; --rbs-warning-light:#FEF3C7;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-xl:20px; --radius-full:9999px;
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.04);
  --shadow-lg:0 10px 15px rgba(0,0,0,.08),0 4px 6px rgba(0,0,0,.03);
  --owl-body:var(--rbs-teal); --owl-beak:var(--rbs-red);
  /* locales de esta página: editor de código y fondo del hero */
  --hero-bg:#0a1920; --ed-bg:#10202b; --ed-fg:#e6f4fa; --mb-gold:#D4A94B;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;font:400 17px/1.6 var(--font-body);background:var(--rbs-ivory);color:var(--rbs-carbon);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-.025em;margin:0;line-height:1.15}
p{margin:0 0 12px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rbs-teal);outline-offset:2px;border-radius:6px}
.owl-body{fill:var(--owl-body)} .owl-beak{fill:var(--owl-beak)}
code{font-family:var(--font-mono);font-size:.9em;background:var(--rbs-gray-100);border:1px solid var(--rbs-gray-200);border-radius:5px;padding:1px 6px;color:var(--rbs-pink-dark);word-break:break-word}

.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--rbs-border)}
.top .in{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font:800 15px var(--font-display);white-space:nowrap;text-decoration:none;color:inherit}
.brand svg{width:40px;height:auto}
.prog{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.bar{flex:1;height:12px;background:var(--rbs-gray-200);border-radius:var(--radius-full);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rbs-teal),var(--rbs-orange));transition:width .4s}
.score{font:700 14px var(--font-display);background:var(--rbs-warning-light);padding:6px 12px;border-radius:var(--radius-full);white-space:nowrap}
.chip{font:700 12px var(--font-display);padding:5px 10px;border-radius:var(--radius-full);background:var(--rbs-gray-100);color:var(--rbs-gray-700);white-space:nowrap}
.chip.ready{background:var(--rbs-success-light);color:var(--rbs-success)} .chip.err{background:var(--rbs-red-light);color:var(--rbs-red)}
.stripes{height:10px;background:repeating-linear-gradient(135deg,var(--rbs-teal) 0 24px,var(--rbs-red) 24px 48px,var(--rbs-orange) 48px 72px,var(--rbs-pink) 72px 96px)}

.app{max-width:1240px;margin:0 auto;padding:20px 16px 60px;display:grid;grid-template-columns:280px 1fr;gap:22px;align-items:start}
.side{position:sticky;top:84px;background:var(--rbs-white);border:1px solid var(--rbs-border);border-radius:var(--radius-xl);padding:14px;max-height:calc(100vh - 104px);overflow:auto}
.side h4{font:700 12px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--rbs-gray-500);margin:14px 8px 6px}
.side h4:first-child{margin-top:4px}
.nv{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:var(--radius-md);font-size:14.5px;font-weight:500;color:var(--rbs-gray-700)}
.nv:hover{background:var(--rbs-gray-100)} .nv.on{background:var(--rbs-teal-light);color:var(--rbs-teal-dark);font-weight:700}
.nv b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--rbs-gray-200);display:grid;place-items:center;font:700 11px var(--font-display)}
.nv.ok b{background:var(--rbs-success);color:#fff}
.nv small{margin-left:auto;color:var(--rbs-gray-500);font-size:12px}
.navsel{display:none;width:100%;border:2px solid var(--rbs-border);border-radius:var(--radius-md);padding:10px;background:#fff;margin-bottom:12px;font-weight:600}

.page{background:var(--rbs-white);border:1px solid var(--rbs-border);border-radius:var(--radius-xl);padding:clamp(18px,3vw,34px);box-shadow:var(--shadow-md);min-width:0}
.kick{font:700 12px var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--rbs-teal)}
.page h2{font-size:clamp(26px,3.6vw,36px);font-weight:800;margin:6px 0 8px}
.lead{font-size:18px;color:var(--rbs-gray-700);max-width:780px}
.blk{margin:16px 0}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:var(--radius-full);padding:10px 18px;font:700 15px var(--font-display);background:var(--rbs-orange);color:#fff;text-decoration:none;box-shadow:var(--shadow-md);transition:transform .15s,background .15s}
.btn:hover{background:var(--rbs-orange-dark);transform:translateY(-2px)}
.btn.teal{background:var(--rbs-teal)} .btn.teal:hover{background:var(--rbs-teal-dark)}
.btn.sec{background:#fff;color:var(--rbs-carbon);border:2px solid var(--rbs-border);box-shadow:none}
.btn.sec:hover{border-color:var(--rbs-teal);background:var(--rbs-teal-light)}
.btn.sm{padding:7px 14px;font-size:13.5px} .btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.callout{border-left:5px solid var(--rbs-warning);background:var(--rbs-warning-light);padding:12px 16px;border-radius:var(--radius-md);font-size:15px;margin:14px 0}
.callout.teal{border-left-color:var(--rbs-teal);background:var(--rbs-teal-light)}

/* editor */
.ed{border:2px solid var(--rbs-border);border-radius:var(--radius-lg);overflow:hidden;background:var(--rbs-white);margin:12px 0}
.ed-bar{display:flex;justify-content:space-between;align-items:center;background:var(--rbs-carbon);color:var(--rbs-gray-300);padding:7px 14px;font:600 12.5px var(--font-mono)}
.ed-bar .dots i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.ed-st{font-family:var(--font-body)}
.ta{display:block;width:100%;background:var(--ed-bg);color:var(--ed-fg);border:0;padding:14px 16px;font:500 14.5px/1.65 var(--font-mono);resize:vertical;tab-size:4;white-space:pre;overflow:auto;min-height:60px}
.ta:focus{outline:3px solid var(--rbs-teal);outline-offset:-3px}
.ed-btns{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;background:var(--rbs-gray-100)}
.res{padding:0 12px 12px}
.out{margin:10px 0 0;background:var(--rbs-carbon);color:#cfe3ea;border-radius:var(--radius-md);padding:10px 14px;font:500 13.5px/1.55 var(--font-mono);white-space:pre-wrap;max-height:240px;overflow:auto}
.out:empty{display:none}
.msg{margin-top:10px;padding:10px 14px;border-radius:var(--radius-md);font-size:15px;font-weight:600}
.msg.bad{background:var(--rbs-red-light);color:var(--rbs-red-dark)} .msg.ok{background:var(--rbs-success-light);color:var(--rbs-success)} .msg.info{background:var(--rbs-teal-light);color:var(--rbs-teal-dark)}
.sol{margin-top:10px}
pre.code{margin:8px 0;background:var(--rbs-carbon);color:#cfe3ea;border-radius:var(--radius-md);padding:14px;font:500 14px/1.65 var(--font-mono);overflow:auto;white-space:pre}

/* reto */
.ch{border:2px solid var(--rbs-orange);border-radius:var(--radius-xl);padding:16px 18px;margin:20px 0;background:var(--rbs-orange-light);position:relative}
.ch.done{border-color:var(--rbs-success);background:var(--rbs-success-light)}
.ch .tg{display:inline-block;font:800 12px var(--font-display);letter-spacing:.08em;text-transform:uppercase;background:var(--rbs-orange);color:#fff;padding:3px 10px;border-radius:var(--radius-full);margin-bottom:6px}
.ch.done .tg{background:var(--rbs-success)}
.ch .ed{background:#fff}
.q{border:2px solid var(--rbs-teal);border-radius:var(--radius-xl);padding:14px 18px;margin:18px 0;background:var(--rbs-teal-light)}
.q.done{border-color:var(--rbs-success);background:var(--rbs-success-light)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{border:2px solid var(--rbs-gray-300);background:#fff;border-radius:var(--radius-md);padding:8px 14px;font-weight:600;font-size:15px;text-align:left}
.opt:hover{border-color:var(--rbs-teal)} .opt.ok{background:var(--rbs-success-light);border-color:var(--rbs-success);color:var(--rbs-success)} .opt.no{background:var(--rbs-red-light);border-color:var(--rbs-red)}
.shake{animation:shake .4s} @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.tk{border-bottom:2px dotted var(--rbs-orange);cursor:pointer;border-radius:3px;white-space:pre}
.tk:hover,.tk.on{background:rgba(249,115,22,.45);color:#fff}

/* home */
.hero{background:radial-gradient(800px 380px at 90% 0%,rgba(0,156,204,.4),transparent 60%),var(--hero-bg);color:#fff;border-radius:var(--radius-xl);padding:clamp(22px,4vw,44px);margin-bottom:18px}
.hero .kick{color:#7fd8f0} .hero h1{font-size:clamp(30px,5vw,48px);font-weight:800;margin:10px 0 12px} .hero h1 em{font-style:normal;color:var(--rbs-orange)}
.hero p{color:#cfe3ea;font-size:18px;max-width:680px}
.hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.hero .chips span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:5px 12px;border-radius:var(--radius-full);font-size:14px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.st{background:var(--rbs-gray-100);border-radius:var(--radius-lg);padding:14px;font-size:15px}
.st b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--rbs-teal);color:#fff;margin-bottom:6px;font-family:var(--font-display)}
.lv{border:1px solid var(--rbs-border);border-left:8px solid var(--c,var(--rbs-teal));border-radius:var(--radius-lg);padding:14px 16px;margin:12px 0}
.lv h3{font-size:19px} .lv p{margin:4px 0 8px;color:var(--rbs-gray-500);font-size:15px}
.lv .ls{display:flex;flex-wrap:wrap;gap:6px}
.lv .ls button{border:2px solid var(--rbs-gray-200);background:#fff;border-radius:var(--radius-full);padding:4px 12px;font-size:13.5px;font-weight:600}
.lv .ls button:hover{border-color:var(--c)} .lv .ls button.ok{background:var(--rbs-success-light);border-color:var(--rbs-success)}
.bx{border-radius:var(--radius-lg);padding:14px 16px 14px 56px;margin:16px 0;position:relative;border:2px solid var(--c);background:var(--cl)}
.bx::before{content:var(--e);position:absolute;left:14px;top:10px;font-size:28px}
.bx h4{font-size:17px;margin-bottom:4px} .bx p{margin:0}
.bx.vida{--c:var(--rbs-orange);--cl:var(--rbs-orange-light);--e:'🏠'}
.bx.idea{--c:var(--rbs-teal);--cl:var(--rbs-teal-light);--e:'💡'}
.bx.cuidado{--c:var(--rbs-red);--cl:var(--rbs-red-light);--e:'⚠️'}
.walk{border:2px solid var(--rbs-border);border-radius:var(--radius-lg);overflow:hidden;margin:12px 0}
.walk pre{margin:0;border-radius:0}
.walk table{margin:0} .walk td:first-child{font-family:var(--font-mono);font-weight:700;color:var(--rbs-pink-dark);white-space:pre-wrap;width:38%;background:var(--rbs-gray-100)}
.walk .wh{background:var(--rbs-teal);color:#fff;font:700 12px var(--font-display);letter-spacing:.08em;text-transform:uppercase;padding:6px 14px}
.voc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:14px 0}
.vc{border:2px solid var(--rbs-border);border-top:6px solid var(--rbs-teal);border-radius:var(--radius-lg);padding:12px 14px;background:#fff}
.vc:nth-child(4n+2){border-top-color:var(--rbs-orange)} .vc:nth-child(4n+3){border-top-color:var(--rbs-pink)} .vc:nth-child(4n+4){border-top-color:var(--rbs-red)}
.vc b{font:800 17px var(--font-display);display:block;margin-bottom:2px}
.vc .ej{margin-top:6px;font-size:14.5px;background:var(--rbs-warning-light);border-radius:var(--radius-md);padding:6px 10px}
.mkw{background:var(--rbs-gray-100);border-radius:var(--radius-md);padding:8px 10px;margin:6px 0}
.mk,.mkb{--mc:var(--rbs-teal);background:var(--mc);color:#fff;border-radius:8px;padding:6px 10px;margin:4px 0;font:600 14px var(--font-body);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.mkb{display:block;width:100%;text-align:left;border:0;cursor:pointer;transition:transform .1s}.mkb:hover{transform:translateX(3px)}
.mk.basic,.mkb.basic{--mc:var(--rbs-teal)}.mk.input,.mkb.input{--mc:var(--rbs-pink-dark)}.mk.loops,.mkb.loops{--mc:var(--rbs-success)}.mk.logic,.mkb.logic{--mc:var(--rbs-teal-dark)}
.mk.vars,.mkb.vars{--mc:var(--rbs-red)}.mk.math,.mkb.math{--mc:var(--rbs-gray-700)}.mk.music,.mkb.music{--mc:var(--rbs-pink)}.mk.led,.mkb.led{--mc:var(--rbs-gray-900)}
.mk.radio,.mkb.radio{--mc:var(--rbs-pink-dark)}.mk.ext,.mkb.ext{--mc:var(--rbs-orange)}.mk.func,.mkb.func{--mc:var(--rbs-red-dark)}.mk.arr,.mkb.arr{--mc:var(--rbs-orange-dark)}
.mk.text,.mkb.text{--mc:var(--rbs-gray-500)}.mk.pins,.mkb.pins,.mk.serial,.mkb.serial{--mc:var(--rbs-gray-700)}
.mk .pl2,.mkb .pl2{background:#fff;color:var(--rbs-carbon);border-radius:12px;padding:1px 9px;margin:0 3px;font-weight:700;display:inline-block}
.mkk{margin:6px 0 2px 12px;padding-left:8px;border-left:6px solid rgba(255,255,255,.4)}
.rm{cursor:pointer}
.dual{border:3px solid var(--rbs-teal);border-radius:var(--radius-xl);padding:12px 14px;margin:18px 0;background:var(--rbs-teal-light)}
.dual-h{font-size:15px;margin-bottom:8px}.dual-g{display:grid;grid-template-columns:1fr 1.2fr;gap:12px}.dual .dt{font:800 12px var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--rbs-teal-dark);margin-bottom:4px}
.dual pre.code{margin:6px 0}.dmap{margin-top:8px;background:#fff;border-radius:var(--radius-md)}.dnote{margin-top:8px;font-size:14.5px;background:#fff;border-radius:var(--radius-md);padding:8px 12px}
.grid3b{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:12px;margin:8px 0}
.bank{display:flex;flex-direction:column;gap:6px;margin:8px 0}.ln{text-align:left;white-space:pre;font:600 14px var(--font-mono);border:2px solid var(--rbs-gray-300);background:#fff;border-radius:8px;padding:6px 10px}.ln:hover{border-color:var(--rbs-teal)}
.al{display:block;cursor:pointer;white-space:pre;padding:0 6px;border-radius:4px}.al:hover{background:rgba(255,255,255,.18)}
.wide{width:100%;font:600 15px var(--font-mono);margin-top:8px}.ta3{width:100%;border:2px solid var(--rbs-border);border-radius:var(--radius-md);padding:8px 12px;font:500 15px/1.5 var(--font-body);resize:vertical;margin:6px 0}
.bl{background:var(--ed-bg);color:var(--ed-fg);border:2px solid var(--rbs-teal);border-radius:6px;font:600 14px var(--font-mono);padding:2px 6px;margin:0 3px}.bl.good{border-color:var(--rbs-success)}.bl.badl{border-color:var(--rbs-red)}
.elr{margin:10px 0}.ecode{display:block;white-space:pre-wrap;margin-bottom:4px}
@media (max-width:800px){.dual-g,.grid3b{grid-template-columns:1fr}}
.act{border:3px solid var(--rbs-pink);border-radius:var(--radius-xl);padding:16px 18px;margin:22px 0;background:var(--rbs-pink-light)}
.act.done{border-color:var(--rbs-success);background:var(--rbs-success-light)}
.act .tg{display:inline-block;font:800 12px var(--font-display);letter-spacing:.08em;text-transform:uppercase;background:var(--rbs-pink);color:#fff;padding:3px 10px;border-radius:var(--radius-full)}
.act.done .tg{background:var(--rbs-success)}
.gl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0;font-size:14px}
.gl .g{background:#fff;border:2px solid var(--rbs-gray-300);border-radius:var(--radius-full);padding:3px 12px;font-weight:600}
.gl .g.ok{background:var(--rbs-success-light);border-color:var(--rbs-success);color:var(--rbs-success)}
.stage{background:#fff;border:2px solid var(--rbs-border);border-radius:var(--radius-lg);padding:14px;margin-top:8px}
.stage label{font-weight:600;font-size:14.5px;display:inline-block;margin:4px 12px 4px 0}
.stage input[type=range]{accent-color:var(--rbs-teal);vertical-align:middle;max-width:170px}
.stage input[type=number],.stage input[type=text],.stage select{border:2px solid var(--rbs-border);border-radius:var(--radius-md);padding:5px 8px;background:#fff;font:600 14px var(--font-mono)}
.stage .ck{display:inline-flex;gap:6px;align-items:center}
.code-line{font:600 14.5px var(--font-mono);background:var(--rbs-carbon);color:#cfe3ea;border-radius:var(--radius-md);padding:8px 12px;margin:10px 0;white-space:pre-wrap;word-break:break-word}
.res-box{margin-top:10px;padding:10px 14px;border-radius:var(--radius-md);font-weight:600;font-size:15px;background:var(--rbs-gray-100);min-height:20px}
.res-box.ok{background:var(--rbs-success-light);color:var(--rbs-success)} .res-box.bad{background:var(--rbs-red-light);color:var(--rbs-red-dark)} .res-box.info{background:var(--rbs-teal-light);color:var(--rbs-teal-dark)}
.chipv{border:2px solid var(--rbs-gray-300);background:#fff;border-radius:var(--radius-full);padding:4px 12px;font:600 14px var(--font-mono);margin:3px}
.chipv.on{background:var(--rbs-orange);border-color:var(--rbs-orange);color:#fff} .chipv:hover{border-color:var(--rbs-teal)}
.slot{margin:6px 0}.slot>span{font-weight:700;display:inline-block;min-width:80px}
.tnr{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;justify-content:center}.tnc{text-align:center}.tnr .op{font:800 32px var(--font-display);align-self:center}
.pl{margin-top:8px;border-radius:var(--radius-md);padding:8px 16px;min-width:130px;display:inline-flex;flex-direction:column;align-items:center}
.pl b{font:800 26px var(--font-mono)} .pl small{font:700 11px var(--font-display);letter-spacing:.1em}
.pl.txt{background:var(--rbs-teal-light);border:3px solid var(--rbs-teal);color:var(--rbs-teal-dark)} .pl.num{background:var(--rbs-orange-light);border:3px solid var(--rbs-orange);color:var(--rbs-orange-dark)} .pl.bad{background:var(--rbs-red-light);border:3px dashed var(--rbs-red);color:var(--rbs-red-dark)}
.boxes{display:flex;gap:14px;flex-wrap:wrap}.vbox{border:3px solid var(--rbs-gray-700);border-radius:var(--radius-md);min-width:130px;text-align:center;background:var(--rbs-warning-light);overflow:hidden}
.vbox .lab{background:var(--rbs-gray-700);color:#fff;font:700 13px var(--font-mono);padding:3px 8px}.vbox .in{font:800 26px var(--font-mono);padding:14px 10px}.vbox small{display:block;background:var(--rbs-gray-100);font:700 11px var(--font-display);padding:2px}
.vbox.flash{animation:pop .6s}@keyframes pop{40%{transform:scale(1.12);background:var(--rbs-success-light)}}
.friends{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.fr{background:var(--rbs-gray-100);border-radius:var(--radius-md);padding:8px 12px;text-align:center;min-width:80px;font-size:22px}.fr.left{background:var(--rbs-red-light)}.fr small{font-size:11px;display:block}
.beads{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.bead{width:52px;text-align:center;border:3px solid var(--rbs-gray-300);border-radius:50%/40%;background:#fff;cursor:pointer;padding:6px 0}.bead b{font:800 24px var(--font-mono);display:block}.bead small{font:700 12px var(--font-display);color:var(--rbs-gray-500)}.bead.sel{background:var(--rbs-pink-light);border-color:var(--rbs-pink)}
.stage pre.code span{display:block;padding:0 6px;border-radius:4px}.stage pre.code span.hl{background:rgba(249,115,22,.45);color:#fff}
.big-e{font:800 28px var(--font-display);text-align:center;margin-top:8px}
.stairs{position:relative;display:flex;align-items:flex-end;gap:2px;height:150px;margin:12px 0;border-bottom:4px solid var(--rbs-gray-500)}.step{width:46px;background:var(--rbs-gray-200);border-radius:6px 6px 0 0;text-align:center;font-weight:700;color:var(--rbs-gray-500);transition:.3s}.step.on{background:var(--rbs-teal);color:#fff}
.walker{position:absolute;left:0;bottom:2px;font-size:30px;transition:.5s}
.meter{height:20px;background:var(--rbs-gray-200);border-radius:10px;overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--rbs-red),var(--rbs-orange));transition:width .5s}
.train{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;margin:12px 0}.loco{font-size:34px}.wag{border:3px solid var(--rbs-teal);background:var(--rbs-teal-light);border-radius:8px;padding:6px 10px;text-align:center;min-width:64px}.wag b{display:block;font:700 15px var(--font-mono)}.wag small{font:800 14px var(--font-display);color:var(--rbs-teal-dark)}
.carnet{border:3px solid var(--rbs-teal);border-radius:var(--radius-md);max-width:340px;background:var(--rbs-teal-light);margin-bottom:10px}.ch2{background:var(--rbs-teal);color:#fff;font:800 14px var(--font-display);padding:4px 12px}.cr{display:flex;justify-content:space-between;padding:5px 12px;border-bottom:1px dashed var(--rbs-teal)}.cr .k{font:700 14px var(--font-mono);color:var(--rbs-teal-dark)}.cr .v{font:700 14px var(--font-mono)}
.machine{display:flex;gap:10px;align-items:center;justify-content:center;margin:8px 0;font-weight:700;flex-wrap:wrap}.machine span{background:var(--rbs-orange-light);border:2px solid var(--rbs-orange);border-radius:var(--radius-md);padding:8px 14px}
.rooms{display:grid;grid-template-columns:1fr 1.3fr;gap:12px}.room{border:3px dashed var(--rbs-gray-400);border-radius:var(--radius-lg);padding:10px}.room.yard{background:var(--rbs-success-light);border-color:var(--rbs-success)}.room h4{margin-bottom:6px}
.tl{cursor:pointer}.tl:hover{background:rgba(255,255,255,.15)}.tl.good{background:var(--rbs-success);color:#fff}.tl.badl{background:var(--rbs-red-dark);color:#fff}
.xl{display:grid;grid-template-columns:repeat(5,44px);gap:4px;margin-left:0;font:700 11px var(--font-display);color:var(--rbs-gray-500);text-align:center}
.mbgrid{display:grid;grid-template-columns:repeat(5,44px);gap:4px;background:#000;padding:8px;border-radius:10px}.px{width:44px;height:44px;border-radius:50%;border:0;background:#3a1010;color:#8a4a4a;font-size:10px}.px.on{background:var(--rbs-red);box-shadow:0 0 10px rgba(232,48,42,.8);color:#fff}
.arena{width:260px;height:200px;background:var(--rbs-gray-100);border:3px solid var(--rbs-gray-300);border-radius:var(--radius-md)}
.radio2{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.rd{background:var(--rbs-gray-100);border-radius:var(--radius-md);padding:10px}.waves{font:800 20px var(--font-display);color:var(--rbs-teal)}
@media (max-width:700px){.rooms,.radio2{grid-template-columns:1fr}}
.bx.paso{--c:var(--rbs-success);--cl:var(--rbs-success-light);--e:'👣'}
.rt{display:grid;grid-template-columns:auto 1fr;gap:16px;margin:8px 0}.rgrid{display:grid;gap:3px;background:var(--rbs-gray-300);padding:3px;border-radius:var(--radius-md)}
.rc{width:44px;height:44px;background:#fff;display:grid;place-items:center;font-size:24px;position:relative;border-radius:6px}.rc.wall{background:var(--rbs-gray-200)}
.botc{position:absolute;inset:6px;border-radius:50%;background:var(--rbs-teal);color:#fff;display:grid;place-items:center;font-size:18px;transition:transform .3s}
.rside{min-width:0}.rpal{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px;align-items:flex-start}
.plist{margin:6px 0;padding-left:22px}.plist li{cursor:pointer;padding:2px 6px;border-radius:6px}.plist li.act{background:var(--rbs-warning-light);font-weight:700}.plist li.vag{background:var(--rbs-red-light);color:var(--rbs-red-dark)}
.sbar{display:flex;gap:6px;align-items:center;font-size:30px;flex-wrap:wrap;margin:8px 0}.sbar span{opacity:.25;filter:grayscale(1);transition:.3s}.sbar span.on{opacity:1;filter:none}.sbar b{font-size:18px;color:var(--rbs-gray-400)}
.opts2{display:flex;flex-direction:column;gap:8px;margin:8px 0}.ob{text-align:left;border:2px solid var(--rbs-gray-300);background:#fff;border-radius:var(--radius-md);padding:8px 14px;font-weight:600;font-size:15px}.ob:hover{border-color:var(--rbs-teal);background:var(--rbs-teal-light)}
.ck2{display:block;margin:5px 0;font-weight:600}.said{background:var(--rbs-warning-light);padding:2px 10px;border-radius:var(--radius-md);font-weight:800}
.trk{position:relative;height:54px;background:var(--rbs-gray-100);border-radius:var(--radius-md);margin:22px 0 8px;border-bottom:4px solid var(--rbs-gray-500)}

.gsvg{width:220px;height:220px}.gwrap{flex:none}
.px2{display:block;width:100%;aspect-ratio:1;border-radius:50%;background:#3a1010}.px2.on{background:var(--rbs-red)}
.mbgrid.sm{grid-template-columns:repeat(5,28px);gap:3px;padding:6px}.mbgrid.sm .px2{width:28px;height:28px}
.tz{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}@media (max-width:700px){.tz,.rt{grid-template-columns:1fr}}
.tzv.boxes .vbox{min-width:90px}.tzc span.hl{background:rgba(249,115,22,.5);color:#fff}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}

/* catálogo */
.cat{margin:18px 0}
.cat h3{font-size:19px;padding:8px 14px;border-radius:var(--radius-md) var(--radius-md) 0 0;color:#fff;background:var(--c)}
.cat .nt{font-size:14px;color:var(--rbs-gray-500);margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rbs-border);vertical-align:top}
th{font:700 12px var(--font-display);text-transform:uppercase;letter-spacing:.06em;color:var(--rbs-gray-500)}
td.bl{font-weight:700;min-width:170px} td code{white-space:pre-wrap;display:inline-block;cursor:copy}
.srch{width:100%;border:2px solid var(--rbs-border);border-radius:var(--radius-md);padding:10px 14px;margin:10px 0}
.note{font-size:14px;color:var(--rbs-gray-500)}
.link{border:0;background:none;color:var(--rbs-teal-dark);font-weight:700;text-decoration:underline;padding:0}

/* simulador */
.sim{border-top:2px solid var(--rbs-border);background:var(--rbs-gray-100);padding:12px}
.sim h5{margin:0 0 8px;font:700 12px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--rbs-gray-500)}
.sim-top{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.mb{background:var(--rbs-carbon);border-radius:14px;padding:10px 12px 0;width:176px;position:relative}
.mb-leds{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:#000;padding:10px;border-radius:10px}
.mb-leds i{aspect-ratio:1;border-radius:50%;background:#3a1010;display:block}
.mb-leds i.on{background:var(--rbs-red);box-shadow:0 0 8px 2px rgba(232,48,42,.7)}
.mb-gold{height:12px;margin:10px -12px 0;border-radius:0 0 14px 14px;background:repeating-linear-gradient(90deg,var(--mb-gold) 0 12px,var(--rbs-carbon) 12px 17px)}
.sim-txt{color:var(--rbs-gray-300);font:700 12px var(--font-mono);text-align:center;min-height:16px;margin-bottom:4px}
.sim-btns{display:flex;flex-wrap:wrap;gap:6px}
.sim-btns button{border:2px solid var(--rbs-gray-300);background:#fff;border-radius:var(--radius-md);padding:6px 12px;font-weight:700;font-size:13.5px}
.sim-btns button:hover{border-color:var(--rbs-teal);background:var(--rbs-teal-light)}
.sim-btns .big{width:44px;font-size:17px}
.dev{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dv{background:#fff;border:1px solid var(--rbs-border);border-radius:var(--radius-md);padding:6px 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.gbar{width:70px;height:8px;border-radius:4px;background:var(--rbs-gray-200);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--rbs-orange);transition:width .3s}
.wheel{width:20px;height:20px;border-radius:50%;border:4px solid var(--rbs-gray-700);border-top-color:var(--rbs-teal);display:inline-block}
.wheel.spin{animation:sp 1s linear infinite} .wheel.rev{animation-direction:reverse}
@keyframes sp{to{transform:rotate(360deg)}}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--rbs-gray-700);background:var(--rbs-gray-200)}
.slog{margin-top:10px;background:var(--rbs-carbon);color:#cfe3ea;border-radius:var(--radius-md);padding:8px 12px;font:500 12.5px/1.5 var(--font-mono);max-height:150px;overflow:auto}
.slog div.w{color:#ffb4b0} .slog:empty{display:none}
.sens{margin-top:10px} .sens summary{cursor:pointer;font:700 13px var(--font-display);padding:4px 0}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 14px;margin-top:8px}
.sg label{display:flex;flex-direction:column;font-size:12.5px;font-weight:600}
.sg input[type=range]{accent-color:var(--rbs-teal);width:100%}
.sg .ck{flex-direction:row;align-items:center;gap:8px}

.cert{background:#fff;border:6px solid var(--rbs-teal);border-radius:var(--radius-xl);padding:30px;text-align:center;position:relative;overflow:hidden;margin-top:16px}
.cert::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:repeating-linear-gradient(135deg,var(--rbs-teal) 0 24px,var(--rbs-red) 24px 48px,var(--rbs-orange) 48px 72px,var(--rbs-pink) 72px 96px)}
.cert svg{width:84px;margin:0 auto 6px;display:block}
.cert h3{font-size:30px;font-weight:800;margin:6px 0}
.cert .nm{font:800 34px var(--font-display);color:var(--rbs-teal);border-bottom:3px solid var(--rbs-border);display:inline-block;min-width:260px;padding:4px 14px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:var(--rbs-carbon);color:#fff;padding:12px 22px;border-radius:var(--radius-full);font:700 15px var(--font-display);opacity:0;transition:.35s;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;top:-12px;width:10px;height:14px;z-index:98;pointer-events:none;border-radius:2px}
input[type=text]{border:2px solid var(--rbs-border);border-radius:var(--radius-md);padding:8px 12px;min-width:0}

@media (max-width:900px){
  .app{grid-template-columns:1fr} .side{display:none} .navsel{display:block}
  .steps{grid-template-columns:1fr 1fr} .sim-top{grid-template-columns:1fr} .mb{margin:0 auto}
  .top .in .chip{display:none}
}
@media (max-width:560px){.steps{grid-template-columns:1fr}.brand span{display:none}.cert .nm{min-width:0;font-size:26px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{body *{visibility:hidden}#cert,#cert *{visibility:visible}#cert{position:absolute;left:0;top:0;width:100%;margin:0}}
</style>

<script>
const PRELUDE = "import sys, io, json, re, math, random, contextlib\n\n_ev = []\n_t = [0]\n_handlers = {}\n_forever = []\n_ns = {}\n_mat = [False] * 25\n_SENS = {}\n\ndef _reset_sens():\n    _SENS.clear()\n    _SENS.update({'temperature': 24, 'light_level': 128, 'sound_level': 40, 'compass': 0, 'accel_x': 0, 'accel_y': 0, 'accel_z': -1024,\n                  'ultrasonic': 40, 'potentiometer': 512, 'light': 512, 'sound': 300, 'humidity': 55,\n                  'ir_obstacle': False, 'pir': False, 'collision': False, 'button': False, 'rocker': 'NO_STATE',\n                  'btn_A': False, 'btn_B': False})\n_reset_sens()\n\ndef _emit(*a):\n    _ev.append([_t[0]] + list(a))\n\ndef _num(v, what):\n    if not isinstance(v, (int, float)) or isinstance(v, bool):\n        raise TypeError(what + ' debe ser un n\u00famero')\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 micro:bit: clases de apoyo \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nclass IconNames:\n    HEART = 'HEART'; SMALL_HEART = 'SMALL_HEART'; HAPPY = 'HAPPY'; SAD = 'SAD'; YES = 'YES'; NO = 'NO'\n    ANGRY = 'ANGRY'; SURPRISED = 'SURPRISED'; ASLEEP = 'ASLEEP'; CONFUSED = 'CONFUSED'; SKULL = 'SKULL'; GHOST = 'GHOST'\n\nclass Button:\n    A = 'A'; B = 'B'; AB = 'AB'\n\nclass Gesture:\n    SHAKE = 'SHAKE'; LOGO_UP = 'LOGO_UP'; LOGO_DOWN = 'LOGO_DOWN'; TILT_LEFT = 'TILT_LEFT'; TILT_RIGHT = 'TILT_RIGHT'\n    SCREEN_UP = 'SCREEN_UP'; SCREEN_DOWN = 'SCREEN_DOWN'; FREE_FALL = 'FREE_FALL'\n\nclass Dimension:\n    X = 'X'; Y = 'Y'; Z = 'Z'; STRENGTH = 'STRENGTH'\n\nclass Note:\n    C = 262; CSHARP = 277; D = 294; EFLAT = 311; E = 330; F = 349; FSHARP = 370; G = 392; GSHARP = 415; A = 440; BFLAT = 466; B = 494; C5 = 523\n\nclass BeatFraction:\n    WHOLE = 1; HALF = 2; QUARTER = 4; EIGHTH = 8; SIXTEENTH = 16\n\nclass DigitalPin:\n    P0 = 'P0'; P1 = 'P1'; P2 = 'P2'; P8 = 'P8'; P12 = 'P12'; P13 = 'P13'; P14 = 'P14'; P15 = 'P15'; P16 = 'P16'\n\nclass AnalogPin:\n    P0 = 'P0'; P1 = 'P1'; P2 = 'P2'\n\nclass basic:\n    @staticmethod\n    def show_icon(icon):\n        for i in range(25): _mat[i] = False\n        _emit('icon', icon)\n    @staticmethod\n    def show_number(n):\n        _num(n, 'basic.show_number necesita un valor que')\n        _emit('num', n)\n    @staticmethod\n    def show_string(s):\n        _emit('str', str(s))\n    @staticmethod\n    def show_leds(pattern):\n        _emit('leds', pattern)\n    @staticmethod\n    def clear_screen():\n        for i in range(25): _mat[i] = False\n        _emit('clear')\n    @staticmethod\n    def pause(ms):\n        _num(ms, 'basic.pause necesita milisegundos, por ejemplo basic.pause(1000), y')\n        _t[0] += ms\n        _emit('pause', ms)\n    @staticmethod\n    def forever(fn):\n        if not callable(fn):\n            raise TypeError('basic.forever necesita una funci\u00f3n SIN par\u00e9ntesis: basic.forever(mi_funcion)')\n        _forever.append(fn)\n\nclass input:\n    @staticmethod\n    def on_button_pressed(btn, fn):\n        if not callable(fn):\n            raise TypeError('on_button_pressed necesita el NOMBRE de la funci\u00f3n, sin par\u00e9ntesis: input.on_button_pressed(Button.A, mi_funcion)')\n        _handlers.setdefault('button:' + btn, []).append(fn)\n    @staticmethod\n    def on_gesture(g, fn):\n        _handlers.setdefault('gesture:' + g, []).append(fn)\n    @staticmethod\n    def button_is_pressed(btn):\n        return bool(_SENS.get('btn_' + btn, False))\n    @staticmethod\n    def temperature():\n        return _SENS['temperature']\n    @staticmethod\n    def light_level():\n        return _SENS['light_level']\n    @staticmethod\n    def sound_level():\n        return _SENS['sound_level']\n    @staticmethod\n    def compass_heading():\n        return _SENS['compass']\n    @staticmethod\n    def acceleration(d):\n        return {'X': _SENS['accel_x'], 'Y': _SENS['accel_y'], 'Z': _SENS['accel_z']}.get(d, 0)\n    @staticmethod\n    def running_time():\n        return _t[0]\n\nclass led:\n    @staticmethod\n    def _chk(x, y):\n        if not (0 <= x <= 4 and 0 <= y <= 4):\n            raise ValueError('La pantalla es de 5 \u00d7 5: x e y van de 0 a 4. Recibi\u00f3 (%s, %s).' % (x, y))\n    @staticmethod\n    def plot(x, y):\n        led._chk(x, y); _mat[y * 5 + x] = True; _emit('plot', x, y)\n    @staticmethod\n    def unplot(x, y):\n        led._chk(x, y); _mat[y * 5 + x] = False; _emit('unplot', x, y)\n    @staticmethod\n    def toggle(x, y):\n        led._chk(x, y); _mat[y * 5 + x] = not _mat[y * 5 + x]; _emit('toggle', x, y)\n    @staticmethod\n    def point(x, y):\n        led._chk(x, y); return _mat[y * 5 + x]\n    @staticmethod\n    def set_brightness(b):\n        _emit('brightness', b)\n    @staticmethod\n    def plot_bar_graph(value, high):\n        _emit('bar', value, high)\n\nclass music:\n    @staticmethod\n    def beat(f):\n        return 2000 / f\n    @staticmethod\n    def play_tone(freq, ms):\n        _num(freq, 'La frecuencia'); _num(ms, 'La duraci\u00f3n')\n        _emit('tone', freq, ms); _t[0] += ms\n    @staticmethod\n    def ring_tone(freq):\n        _emit('tone', freq, 0)\n    @staticmethod\n    def rest(ms):\n        _t[0] += ms; _emit('pause', ms)\n    @staticmethod\n    def set_tempo(bpm):\n        _emit('tempo', bpm)\n\nclass radio:\n    @staticmethod\n    def set_group(n):\n        _emit('radiogroup', n)\n    @staticmethod\n    def send_number(n):\n        _emit('radio', 'number', n)\n    @staticmethod\n    def send_string(s):\n        _emit('radio', 'string', s)\n    @staticmethod\n    def send_value(name, v):\n        _emit('radio', 'value', name, v)\n    @staticmethod\n    def on_received_number(fn):\n        _handlers.setdefault('radio:number', []).append(fn)\n    @staticmethod\n    def on_received_string(fn):\n        _handlers.setdefault('radio:string', []).append(fn)\n    @staticmethod\n    def on_received_value(fn):\n        _handlers.setdefault('radio:value', []).appen perBitV2:\n    class enServo:\n        S1 = 'S1'; S2 = 'S2'; S3 = 'S3'; S4 = 'S4'; S5 = 'S5'; S6 = 'S6'; S7 = 'S7'; S8 = 'S8'\n    class enMotors:\n        M1 = 'M1'; M2 = 'M2'; M3 = 'M3'; M4 = 'M4'\n    class enMusic:\n        DADADUM = 'DADADUM'; ENTERTAINER = 'ENTERTAINER'; PRELUDE = 'PRELUDE'; ODE = 'ODE'; NYAN = 'NYAN'; RINGTONE = 'RINGTONE'\n        FUNK = 'FUNK'; BLUES = 'BLUES'; BIRTHDAY = 'BIRTHDAY'; WEDDING = 'WEDDING'; FUNEREAL = 'FUNEREAL'; PUNCHLINE = 'PUNCHLINE'\n        BADDY = 'BADDY'; CHASE = 'CHASE'; BA_DING = 'BA_DING'; WAWAWAWAA = 'WAWAWAWAA'; JUMP_UP = 'JUMP_UP'; JUMP_DOWN = 'JUMP_DOWN'\n        POWER_UP = 'POWER_UP'; POWER_DOWN = 'POWER_DOWN'\n    class enPos:\n        FORWARD = 'FORWARD'; REVERSE = 'REVERSE'; STOP = 'STOP'\n    @staticmethod\n    def _servo(port, deg, top, kind):\n        if port not in _SERVOS:\n            raise ValueError('Puerto de servo desconocido. Usa SuperBitV2.enServo.S4, por ejemplo.')\n        _num(deg, 'El \u00e1ngulo del servo')\n        if deg < 0 or deg > top:\n            _emit('warn', 'Este servo acepta \u00e1ngulos de 0 a %s. Recibi\u00f3 %s.' % (top, deg))\n            deg = max(0, min(top, deg))\n        _emit('servo', port, deg, kind)\n    @staticmethod\n    def servo(port, deg):\n        SuperBitV2._servo(port, deg, 180, 180)\n    @staticmethod\n    def servo2(port, deg):\n        SuperBitV2._servo(port, deg, 270, 270)\n    @staticmethod\n    def servo3(port, pos, value):\n        _emit('servo360', port, pos, value)\n    @staticmethod\n    def servo4(port, pos, value):\n        _emit('servo360', port, pos, value)\n    @staticmethod\n    def motor_run(m, v):\n        if m not in _MOTORS:\n            raise ValueError('Puerto de motor desconocido. Usa SuperBitV2.enMotors.M3, por ejemplo.')\n        _num(v, 'La velocidad del motor')\n        if abs(v) > 255:\n            _emit('warn', 'La velocidad de un motor va de -255 a 255.'); v = max(-255, min(255, v))\n        _emit('motor', m, v)\n    @staticmethod\n    def motor_run_dual(m1, v1, m2, v2):\n        for m in (m1, m2):\n            if m not in _MOTORS:\n                raise ValueError('Puerto de motor desconocido. Usa SuperBitV2.enMotors.M3, por ejemplo.')\n        _num(v1, 'La velocidad del motor'); _num(v2, 'La velocidad del motor')\n        if abs(v1) > 255 or abs(v2) > 255:\n            _emit('warn', 'La velocidad de un motor va de -255 a 255.')\n            v1 = max(-255, min(255, v1)); v2 = max(-255, min(255, v2))\n        _emit('motors', m1, v1, m2, v2)\n    @staticmethod\n    def motor_stop_all():\n        _emit('motorstop')\n    @staticmethod\n    def music(name):\n        if name not in _MUSIC:\n            raise ValueError('Melod\u00eda desconocida. Prueba SuperBitV2.enMusic.DADADUM.')\n        _emit('music', name)\n    @staticmethod\n    def rgb_program():\n        return neopixel._Strip()\n\nclass SuperBitV2_PWM:\n    class enColor:\n        OFF = 'OFF'; RED = 'RED'; GREEN = 'GREEN'; BLUE = 'BLUE'; WHITE = 'WHITE'; CYAN = 'CYAN'; PINKISH = 'PINKISH'; YELLOW = 'YELLOW'\n    class mwDigitalNum:\n        P4P6 = 'P4P6'; P1P2 = 'P1P2'; P0P3 = 'P0P3'; P10P9 = 'P10P9'; P7P8 = 'P7P8'; P5P11 = 'P5P11'\n    @staticmethod\n    def rgb(a, b, c):\n        for v in (a, b, c):\n            _num(v, 'Cada valor del RGB')\n            if v < 0 or v > 255:\n                raise ValueError('Cada valor RGB va de 0 a 255. Recibi\u00f3 %s.' % v)\n        _emit('rgb', a, b, c)\n    @staticmethod\n    def rgb2(color):\n        _emit('rgbname', color)\n    @staticmethod\n    def buzzer_pin(p):\n        _emit('buzzerpin', p)\n    @staticmethod\n    def vibration_mot(p, speed):\n        _num(speed, 'La velocidad'); _emit('vibmot', p, speed)\n\nclass SuperBitV2_Digital:\n    class mwDigitalNum:\n        P4P6 = 'P4P6'; P1P2 = 'P1P2'; P0P3 = 'P0P3'; P10P9 = 'P10P9'; P7P8 = 'P7P8'; P5P11 = 'P5P11'\n    class enObstacle:\n        OBSTACLE = 'OBSTACLE'; NO_OBSTACLE = 'NO_OBSTACLE'\n    class enPIR:\n        NO_PIR = 'NO_PIR'; OPIR = 'OPIR'\n    class enCollision:\n        NO_COLLISION = 'NO_COLLISION'; O_COLLISION = 'O_COLLISION'\n    class enButton:\n        PRESS = 'PRESS'; REALSE = 'REALSE'\n    class DHT11Type:\n        DHT11_TEMPERATURE_C = 'C'; DHT11_TEMPERATURE_F = 'F'; DHT11_HUMIDITY = 'H'\n    @staticmethod\n    def ultrasonic(p):\n        return _SENS['ultrasonic']\n    @staticmethod\n    def ir(p, v):\n        return bool(_SENS['ir_obstacle']) == (v == 'OBSTACLE')\n    @staticmethod\n    def pir(p, v):\n        return bool(_SENS['pir']) == (v == 'OPIR')\n    @staticmethod\n    def collision(p, v):\n        return bool(_SENS['collision']) == (v == 'O_COLLISION')\n    @staticmethod\n    def button(p, v):\n        return bool(_SENS['button']) == (v == 'PRESS')\n    @staticmethod\n    def vibration(p, fn):\n        _handlers.setdefault('vibration', []).append(fn)\n    @staticmethod\n    def dht11value(t, p):\n        return {'C': _SENS['temperature'], 'F': _SENS['temperature'] * 9 / 5 + 32, 'H': _SENS['humidity']}[t]\n\nclass SuperBitV2_Analog:\n    class mwAnalogNum:\n        AP4P6 = 'AP4P6'; AP1P2 = 'AP1P2'; AP0P3 = 'AP0P3'; AP10P9 = 'AP10P9'\n    class mwAnalogNum2:\n        AP1P2 = 'AP1P2'; AP0P3 = 'AP0P3'\n    class enRocker:\n        NO_STATE = 'NO_STATE'; UP = 'UP'; DOWN = 'DOWN'; LEFT = 'LEFT'; RIGHT = 'RIGHT'\n    @staticmethod\n    def light(p):\n        return _SENS['light']\n    @staticmethod\n    def sound(p):\n        return _SENS['sound']\n    @staticmethod\n    def potentiometer(p):\n        return _SENS['potentiometer']\n    @staticmethod\n    def rocker(p, v):\n        return _SENS['rocker'] == v\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 motor de pruebas \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndef _trigger(kind, *args):\n    for f in list(_handlers.get(kind, [])):\n        f(*args)\n\ndef press(b):\n    _trigger('button:' + b)\n\ndef _cap(fn, *a, **k):\n    buf = io.StringIO()\n    with contextlib.redirect_stdout(buf):\n        fn(*a, **k)\n    return buf.getvalue()\n\n_BASE = dict(basic=basic, input=input, led=led, music=music, radio=radio, pins=pins, serial=serial, control=control, randint=randint,\n             Button=Button, Gesture=Gesture, Dimension=Dimension, Note=Note, BeatFraction=BeatFraction, DigitalPin=DigitalPin,\n             AnalogPin=AnalogPin, IconNames=IconNames, neopixel=neopixel, NeoPixelColors=NeoPixelColors,\n             SuperBitV2=SuperBitV2, SuperBitV2_PWM=SuperBitV2_PWM, SuperBitV2_Digital=SuperBitV2_Digital, SuperBitV2_Analog=SuperBitV2_Analog,\n             press=press)\n\ndef _seq(ev, items):\n    i = 0\n    for e in ev:\n        if i < len(items) and tuple(e) == tuple(items[i]):\n            i += 1\n    return i == len(items)\n\ndef _line(e):\n    tb = e.__traceback__\n    ln = None\n    while tb:\n        if tb.tb_frame.f_code.co_filename == '<tu_c\u00f3digo>':\n            ln = tb.tb_lineno\n        tb = tb.tb_next\n    return ln\n\ndef _explain(e):\n    if isinstance(e, SyntaxError):\n        ln = e.lineno\n        pre = ('L\u00ednea %s: ' % ln) if ln else ''\n        m = e.msg or ''\n        tip = ''\n        low = m.lower()\n        if \"expected ':'\" in low:\n            tip = 'Falta \":\" al final de la l\u00ednea (if, elif, else, for, while, def).'\n        elif 'indent' in low:\n            tip = 'Revisa la sangr\u00eda: lo que va dentro de un if, for, while o def lleva 4 espacios.'\n        elif 'never closed' in low or 'unterminated' in low:\n            tip = 'Falta cerrar un par\u00e9ntesis, corchete o comilla.'\n        elif 'invalid syntax' in low:\n            tip = 'Hay algo mal escrito en esa l\u00ednea (o justo en la anterior): revisa comas, par\u00e9ntesis y dos puntos.'\n        return pre + 'error de sintaxis. ' + m + '. ' + tip\n    ln = _line(e)\n    pre = ('L\u00ednea %s: ' % ln) if ln else ''\n    if isinstance(e, UnboundLocalError):\n        return pre + 'est\u00e1s cambiando dentro de una funci\u00f3n una variable que vive afuera. Declara \"global nombre\" al inicio de la funci\u00f3n. ' + str(e)\n    if isinstance(e, NameError):\n        return pre + \"Python no conoce el nombre '%s'. \u00bfLo escribiste igual, con las mismas may\u00fasculas? \u00bfLo creaste antes de usarlo?\" % e.name\n    if isinstance(e, ZeroDivisionError):\n        return pre + 'no se puede dividir entre cero.'\n    if isinstance(e, IndexError):\n        return pre + 'te saliste de la lista: ese \u00edndice no existe. ' + str(e)\n    if isinstance(e, KeyError):\n        return pre + 'la clave %s no existe en el diccionario.' % str(e)\n    if isinstance(e, TypeError):\n        return pre + 'tipo de dato incorrecto. ' + str(e)\n    if isinstance(e, ValueError):\n        return pre + 'valor incorrecto. ' + str(e)\n    if isinstance(e, AttributeError):\n        return pre + 'ese objeto no tiene lo que le pides. ' + str(e)\n    if isinstance(e, RecursionError):\n        return pre + 'una funci\u00f3n se llama a s\u00ed misma sin parar.'\n    return pre + type(e).__name__ + ': ' + str(e)\n\ndef _rerun(src, **kw):\n    for k in kw:\n        src = re.sub(r'^' + k + r'\\s*=.*$', '', src, count=1, flags=re.M)\n    ns = dict(_BASE)\n    ns.update(kw)\n    buf = io.StringIO()\n    with contextlib.redirect_stdout(buf):\n        exec(compile(src, '<tu_c\u00f3digo>', 'exec'), ns)\n    return buf.getvalue()\n\ndef _run(code, test):\n    global _ns\n    _ev.clear(); _handlers.clear(); del _forever[:]; _t[0] = 0\n    for i in range(25): _mat[i] = False\n    _reset_sens()\n    _ns = dict(_BASE)\n    buf = io.StringIO()\n    res = {'ok': True, 'error': None, 'test': None}\n    try:\n        with contextlib.redirect_stdout(buf):\n            exec(compile(code, '<tu_c\u00f3digo>', 'exec'), _ns)\n    except BaseException as e:\n        res['ok'] = False\n        res['error'] = _explain(e)\n    res['stdout'] = buf.getvalue()\n    res['log'] = [list(x) for x in _ev]\n    if res['ok'] and test:\n        _ns['SRC'] = code\n        _ns['OUT'] = res['stdout']\n        _ns['E'] = lambda: [tuple(x[1:]) for x in _ev]\n        _ns['clear'] = lambda: _ev.clear()\n        _ns['cap'] = _cap\n        _ns['SENS'] = _SENS\n        _ns['seq'] = _seq\n        _ns['trigger'] = _trigger\n        _ns['rerun'] = lambda **kw: _rerun(code, **kw)\n        try:\n            exec(compile(test, '<test>', 'exec'), _ns)\n            res['test'] = [True, '']\n        except AssertionError as e:\n            res['test'] = [False, str(e) or 'Todav\u00eda no cumple lo que pide el reto.']\n        except BaseException as e:\n            res['test'] = [False, 'Al probar tu c\u00f3digo apareci\u00f3 un problema: ' + _explain(e)]\n    return json.dumps(res)\n\ndef _sens(k, v):\n    _SENS[k] = v\n\ndef _fire(kind, args_json):\n    args = json.loads(args_json)\n    start = len(_ev)\n    buf = io.StringIO()\n    err = None\n    try:\n        with contextlib.redirect_stdout(buf):\n            if kind == 'forever':\n                for _ in range(3):\n                    for f in list(_forever):\n                        f()\n            else:\n                _trigger(kind, *args)\n    except BaseException as e:\n        err = _explain(e)\n    return json.dumps({'log': [list(x) for x in _ev[start:]], 'error': err, 'stdout': buf.getvalue()})\n";

LESSONS.push({ id: 'l12', lv: 2, t: 'Depurar: leer errores y corregirlos', lead: 'Programar es 50 % escribir y 50 % encontrar qué salió mal.', b: [

  P('Tres tipos de error: <b>sintaxis</b> (mal escrito, no arranca), <b>de ejecución</b> (se rompe en medio, como dividir entre cero) y <b>de lógica</b> (corre, pero no hace lo que querías). Los mensajes de error te dicen <b>la línea</b> y <b>qué pasó</b>: léelos siempre.'),
  EX(r`# Prueba cambiar el 0 por otro número
try:
    print(10 / 0)
except ZeroDivisionError:
    print("No se puede dividir entre cero")`),
  P('<code>try / except</code> deja que el programa se recupere de un error en vez de romperse.'),
  VZ('l12v1', 'detective', 'Detective de errores', 'En cada caso hay una línea con un problema. Tócala para encontrarla.'),
  CH({ id: 'l12c1', t: 'Error de lógica', q: 'Este promedio corre, pero está mal: <code>promedio(2, 4)</code> debería dar 3. Corrígelo.', start: 'def promedio(a, b):\n    return a + b / 2', sol: 'def promedio(a, b):\n    return (a + b) / 2',

  CH({ id: 'l12c2', t: 'Cuatro errores de sintaxis', q: 'Corrige el programa para que imprima <code>Lanzando a 120</code>.', start: 'def lanzar(angulo)\n    if angulo > 90\n        print("Lanzando a" angulo)\n    else:\n        print("Ángulo bajo")\nlanzar(120)', sol: 'def lanzar(angulo):\n    if angulo > 90:\n        print("Lanzando a", angulo)\n    else:\n        print("Ángulo bajo")\nlanzar(120)', noStart: false,

  CH({ id: 'l12c3', t: 'División segura', q: 'Escribe <code>dividir_seguro(a, b)</code> con try/except: devuelve a ÷ b, o <code>None</code> si b es 0.', start: '', sol: 'def dividir_seguro(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return None',

  QZ({ id: 'l12q1', q: 'El programa corre sin errores, pero el robot avanza 10 segundos en vez de 1. ¿Qué tipo de error es?', opts: ['Sintaxis', 'Lógica', 'Hardware'], a: 1, why: 'Está bien escrito, pero no hace lo que querías.' }),
  QZ({ id: 'l12q2', q: 'Python dice: SyntaxError: expected ":" . ¿Qué hacer?', opts: ['Cambiar de computador', 'Agregar : al final de la línea del if, for, while o def', 'Borrar el programa'], a: 1, why: 'El mensaje te dice qué falta y en qué línea.' })
] });

LESSONS.push({ id: 'l13', lv: 3, t: 'Cómo se lee un programa de MakeCode Python', lead: 'Antes de escribir, aprende a leer: cada línea de tu robot tiene un significado.', b: [

LESSONS.push({ id: 'l17', lv: 3, t: 'Pines, serial y control', lead: 'Hablar con el mundo exterior: pines, el computador (serial) y bloques de control.', b: [
  P('<b>Pins</b>: <code>pins.digital_write_pin(DigitalPin.P0, 1)</code> pone el pin en encendido (1) o apagado (0); <code>pins.analog_read_pin(AnalogPin.P0)</code> lee un valor de 0 a 1023. <b>Serial</b>: <code>serial.write_line("texto")</code> envía mensajes al computador: perfecto para <b>depurar</b>. <b>Control</b>: <code>control.in_background(fn)</code> ejecuta algo en paralelo y <code>control.reset()</code> reinicia la placa.'),
  EX(r`for i in range(3):
    pins.digital_write_pin(DigitalPin.P0, 1)
    basic.pause(300)
    pins.digital_write_pin(DigitalPin.P0, 0)
    basic.pause(300)
serial.write_line("listo")`, { robot: true }),
  CH({ id: 'l17c1', t: 'Mensajes al computador', q: 'Con un for envía por serial los textos <code>"0"</code>, <code>"1"</code> y <code>"2"</code> (<code>serial.write_line(str(i))</code>).', start: '', sol: 'for i in range(3):\n    serial.write_line(str(i))', robot: true,
    test: r`s=[e[1] for e in E() if e[0]=="serial"]
assert s==["0","1","2"], "Deben enviarse 0, 1 y 2 por serial"`, hint: 'str(i) convierte el número en texto.' }),
  CH({ id: 'l17c2', t: 'Parpadeo en un pin', q: 'En P0: 3 veces encender (1), esperar 500 ms, apagar (0) y esperar 500 ms.', start: '', sol: 'for i in range(3):\n    pins.digital_write_pin(DigitalPin.P0, 1)\n    basic.pause(500)\n    pins.digital_write_pin(DigitalPin.P0, 0)\n    basic.pause(500)', robot: true,
    test: r`v=[e[3] for e in E() if e[0]=="pin"]
assert v==[1,0,1,0,1,0], "Deben alternar 1, 0, 1, 0, 1, 0 en el pin"`, hint: 'Dentro del for: write 1, pause, write 0, pause.' }),
  QZ({ id: 'l17q1', q: '¿Para qué sirve serial.write_line mientras programas?', opts: ['Para dibujar en la pantalla LED', 'Para enviar mensajes al computador y ver qué hace el programa', 'Para mover un servo'], a: 1, why: 'Es la "linterna" del programador para depurar.' }),
  P('➡ Revisa la pestaña <b>Catálogo de bloques</b> para ver todos los bloques del micro:bit (también los que aquí no se simulan, como Bluetooth).')
] });

LESSONS.push({ id: 'l18', lv: 4, t: 'La extensión SuperBitV2', lead: 'Cómo agregar la librería de Yahboom y cómo se ve cada bloque en Python.', b: [
  BOX('vida', 'Pedirle algo al robot', 'En el ascensor dices el piso: <code>ascensor(4)</code>. Al robot le dices <b>cuál</b> servo y <b>cuánto</b> girar: <code>SuperBitV2.servo(S4, 180)</code> → dos argumentos: el <b>puerto</b> (qué servo) y el <b>ángulo</b> (cuánto).'),
  P('En MakeCode: <b>Extensiones</b> → <b>pega</b> <code>https://github.com/YahboomTechnology/SuperBitLibV2</code> (buscar solo el nombre no la encuentra). Aparecen cuatro categorías: <b>SuperBitV2</b> (servos, motores, música, RGB_Program), <b>SuperBitV2_Digital</b> (sensores digitales), <b>SuperBitV2_Analog</b> (sensores analógicos) y <b>SuperBitV2_PWM</b> (zumbador, motor de vibración, RGB).'),
  P('<b>Regla de traducción:</b> el nombre del bloque pasa a minúsculas con guion bajo: <code>MotorRunDual</code> → <code>motor_run_dual</code>; <code>Servo</code> → <code>servo</code>; las opciones salen de la enumeración: <code>SuperBitV2.enServo.S4</code>.'),
  EX(r`def on_button_pressed_a():
    basic.show_icon(IconNames.YES)
    SuperBitV2.music(SuperBitV2.enMusic.DADADUM)
    SuperBitV2.servo(SuperBitV2.enServo.S4, 180)
    SuperBitV2.motor_run_dual(SuperBitV2.enMotors.M3, 255, SuperBitV2.enMotors.M4, 255)
input.on_button_pressed(Button.A, on_button_pressed_a)

basic.show_icon(IconNames.HAPPY)
SuperBitV2.servo(SuperBitV2.enServo.S4, 74)`, { robot: true }),
  ANAT({ title: 'Desarmando una instrucción del robot', code: '<span class="tk" data-t="lib">SuperBitV2</span><span class="tk" data-t="fn">.servo</span><span class="tk" data-t="p1">(</span><span class="tk" data-t="port">SuperBitV2.enServo.S4</span><span class="tk" data-t="c">,</span> <span class="tk" data-t="ang">180</span><span class="tk" data-t="p2">)</span>',
    info: { lib: '<b>SuperBitV2</b>: la biblioteca (extensión) que controla la tarjeta Super:bit V2.', fn: '<b>.servo</b>: la función para mover un servomotor de 180°.', p1: 'Los <b>paréntesis</b> delimitan los argumentos.', port: '<b>SuperBitV2.enServo.S4</b>: identifica el puerto S4. Es una opción de una enumeración.', c: 'La <b>coma</b> separa los argumentos.', ang: '<b>180</b>: el ángulo solicitado. Es una orden al servo; calibra con tu montaje real sin forzarlo.', p2: 'Cierra los argumentos.' } }),
  P('<b>Importante:</b> los nombres en Python los genera MakeCode. Si dudas de uno, arma el bloque, pulsa el botón <b>Python</b> y cópialo de ahí. Aquí el simulador implementa estas funciones, pero tu robot real manda.'),
  CH({ id: 'l18c1', t: 'Reescribe el programa del robot', q: 'Escríbelo tú: al iniciar muestra <code>HAPPY</code> y lleva el servo S4 a 74°. Al presionar <b>A</b>: muestra <code>YES</code>, suena <code>DADADUM</code>, servo S4 a 180° y motores M3 y M4 a 255.', start: '', sol: 'basic.show_icon(IconNames.HAPPY)\nSuperBitV2.servo(SuperBitV2.enServo.S4, 74)\n\ndef on_button_pressed_a():\n    basic.show_icon(IconNames.YES)\n    SuperBitV2.music(SuperBitV2.enMusic.DADADUM)\n    SuperBitV2.servo(SuperBitV2.enServo.S4, 180)\n    SuperBitV2.motor_run_dual(SuperBitV2.enMotors.M3, 255, SuperBitV2.enMotors.M4, 255)\ninput.on_button_pressed(Button.A, on_button_pressed_a)', robot: true,
    test: r`assert ("icon","HAPPY") in E(), "Al iniciar debe mostrar HAPPY"
assert ("servo","S4",74,180) in E(), "Al iniciar el servo S4 debe ir a 74"
clear(); press("A")
assert seq(E(),[("icon","YES"),("music","DADADUM"),("servo","S4",180,180),("motors","M3",255,"M4",255)]), "Al presionar A: YES, música, servo S4 a 180 y motores M3/M4 a 255, en ese orden"`, hint: 'Copia el ejemplo, pero esta vez escribe cada línea tú.' }),
  CH({ id: 'l18c2', t: 'Modifica el puerto y el botón', q: 'Cambia el programa: ahora el botón <b>B</b> lleva el servo <b>S1</b> a <b>90°</b> (y nada más).', start: 'def on_button_pressed_a():\n    SuperBitV2.servo(SuperBitV2.enServo.S4, 180)\ninput.on_button_pressed(Button.A, on_button_pressed_a)', sol: 'def on_button_pressed_b():\n    SuperBitV2.servo(SuperBitV2.enServo.S1, 90)\ninput.on_button_pressed(Button.B, on_button_pressed_b)', robot: true,
    test: r`clear(); press("B")
assert ("servo","S1",90,180) in E(), "B debe mover el servo S1 a 90"
clear(); press("A")
assert not any(e[0]=="servo" for e in E()), "A ya no debe mover ningún servo"`, hint: 'Cambia Button.A→Button.B, S4→S1 y 180→90.' }),
  QZ({ id: 'l18q1', q: 'En SuperBitV2.servo(SuperBitV2.enServo.S4, 180), ¿qué es el 180?', opts: ['El puerto', 'El ángulo que se le pide al servo', 'La velocidad del motor'], a: 1, why: 'El primer argumento es el puerto; el segundo, el ángulo.' })
] });

LESSONS.push({ id: 'l19', lv: 4, t: 'Servos: 180°, 270° y 360°', lead: 'Tres clases de servo, tres funciones.', b: [
  P('<code>servo(puerto, grados)</code> mueve un servo de <b>180°</b> (0 a 180). <code>servo2(puerto, grados)</code> es para servos de <b>270°</b> (0 a 270). <code>servo3</code> y <code>servo4</code> son para servos de <b>360°</b>: reciben una dirección (<code>SuperBitV2.enPos.FORWARD</code>, <code>REVERSE</code> o <code>STOP</code>) y un valor de 0 a 90. El servo <b>no gira libre</b>: va a la posición que le pides y se queda ahí.'),

basic.pause(500)
SuperBitV2.servo(SuperBitV2.enServo.S4, 180)
basic.pause(500)
SuperBitV2.servo2(SuperBitV2.enServo.S2, 270)
SuperBitV2.servo3(SuperBitV2.enServo.S3, SuperBitV2.enPos.FORWARD, 50)`, { robot: true }),
  VZ('l19v1', 'servo', 'Mueve el servo', 'El servo va al ángulo que le pides y se queda ahí. Mira cómo cambian los dos argumentos del código.'),
  CH({ id: 'l19c1', t: 'Barrido', q: 'Barre el servo S4 de 0 a 180 en pasos de 45 (0, 45, 90, 135, 180) con un for, y una pausa de 300 ms entre cada uno.', start: '', sol: 'for angulo in range(0, 181, 45):\n    SuperBitV2.servo(SuperBitV2.enServo.S4, angulo)\n    basic.pause(300)', robot: true,

assert a==[0,45,90,135,180], "El servo debe pasar por 0, 45, 90, 135 y 180"
assert len([e for e in E() if e[0]=="pause" and e[1]==300])==5, "Pausa de 300 ms después de cada ángulo"`, hint: 'range(0, 181, 45) incluye el 180.' }),
  CH({ id: 'l19c2', t: 'Servo de 270°', q: 'Lleva el servo de 270° que está en <b>S2</b> hasta <code>270</code>.', start: '', sol: 'SuperBitV2.servo2(SuperBitV2.enServo.S2, 270)', robot: true,
    test: r`assert ("servo","S2",270,270) in E(), "Usa servo2 con S2 y 270"`, hint: 'SuperBitV2.servo2(...)' }),
  CH({ id: 'l19c3', t: 'Servo de 360°', q: 'Haz girar un servo de 360° en <b>S3</b> hacia adelante con valor 50: <code>servo3(puerto, SuperBitV2.enPos.FORWARD, 50)</code>.', start: '', sol: 'SuperBitV2.servo3(SuperBitV2.enServo.S3, SuperBitV2.enPos.FORWARD, 50)', robot: true,
    test: r`assert ("servo360","S3","FORWARD",50) in E(), "Usa servo3 con S3, FORWARD y 50"`, hint: 'Tres argumentos: puerto, dirección y valor.' }),
  CH({ id: 'l19c4', t: 'Función lanzar()', q: 'Escribe <code>lanzar()</code>: servo S4 a 180°, espera 500 ms y vuelve a 74°. Conecta la función al botón A.', start: '', sol: 'def lanzar():\n    SuperBitV2.servo(SuperBitV2.enServo.S4, 180)\n    basic.pause(500)\n    SuperBitV2.servo(SuperBitV2.enServo.S4, 74)\n\ndef on_button_pressed_a():\n    lanzar()\ninput.on_button_pressed(Button.A, on_button_pressed_a)', robot: true,
    test: r`clear(); press("A")
assert seq(E(),[("servo","S4",180,180),("pause",500),("servo","S4",74,180)]), "A debe: servo 180, pausa de 500 y servo 74"
assert "def lanzar" in SRC, "Define la función lanzar()"`, hint: 'La función del botón solo llama a lanzar().' }),
  QZ({ id: 'l19q1', q: 'Pides SuperBitV2.servo(S4, 250) a un servo de 180°. ¿Qué pasa?', opts: ['Gira 250°', 'Es un valor fuera de rango: el servo solo llega a 180', 'Se apaga la placa'], a: 1, why: 'Respeta los rangos y no fuerces el mecanismo.' })
] });

LESSONS.push({ id: 'l20', lv: 4, t: 'Motores y movimiento', lead: 'Hacer rodar el robot: un motor, dos motores, parar todo.', b: [

  P('<code>motor_run(motor, velocidad)</code> mueve un motor. <code>motor_run_dual(m1, v1, m2, v2)</code> mueve dos a la vez. <code>motor_stop_all()</code> los detiene. La velocidad va de <b>−255 a 255</b> y el <b>signo</b> da el sentido. Si uno va a +150 y el otro a −150, el robot <b>gira en su lugar</b>.'),

SuperBitV2.motor_run_dual(SuperBitV2.enMotors.M3, 150, SuperBitV2.enMotors.M4, 150)
basic.pause(2000)
SuperBitV2.motor_stop_all()`, { robot: true }),

  CH({ id: 'l20c1', t: 'Avanzar y parar', q: 'Al presionar <b>A</b>: motores M3 y M4 a 150, esperar 2000 ms y <code>motor_stop_all()</code>.', start: '', sol: 'def on_button_pressed_a():\n    SuperBitV2.motor_run_dual(SuperBitV2.enMotors.M3, 150, SuperBitV2.enMotors.M4, 150)\n    basic.pause(2000)\n    SuperBitV2.motor_stop_all()\ninput.on_button_pressed(Button.A, on_button_pressed_a)', robot: true,

  CH({ id: 'l20c2', t: 'Girar en el lugar', q: 'Al presionar <b>B</b>: M3 a 150 y M4 a −150 durante 1000 ms y luego parar todo.', start: '', sol: 'def on_button_pressed_b():\n    SuperBitV2.motor_run_dual(SuperBitV2.enMotors.M3, 150, SuperBitV2.enMotors.M4, -150)\n    basic.pause(1000)\n    SuperBitV2.motor_stop_all()\ninput.on_button_pressed(Button.B, on_button_pressed_b)', robot: true,
    test: r`clear(); press("B")
assert seq(E(),[("motors","M3",150,"M4",-150),("pause",1000),("motorstop",)]), "B: M3=150, M4=-150, pausa de 1000 y parar"`, hint: 'Un número negativo invierte el sentido.' }),
  CH({ id: 'l20c3', t: 'Función avanzar(velocidad, ms)', q: 'Escribe <code>avanzar(velocidad, ms)</code>: ambos motores a esa velocidad, esperar ms milisegundos y parar todo.', start: '', sol: 'def avanzar(velocidad, ms):\n    SuperBitV2.motor_run_dual(SuperBitV2.enMotors.M3, velocidad, SuperBitV2.enMotors.M4, velocidad)\n    basic.pause(ms)\n    SuperBitV2.motor_stop_all()', robot: true,
    test: r`clear(); avanzar(100,500)
assert seq(E(),[("motors","M3",100,"M4",100),("pause",500),("motorstop",)]), "avanzar(100, 500): motores a 100, pausa de 500 y parar"
clear(); avanzar(200,1500)
assert seq(E(),[("motors","M3",200,"M4",200),("pause",1500),("motorstop",)]), "Usa los parámetros velocidad y ms"`, hint: 'Reemplaza los números por los parámetros.' }),
  CH({ id: 'l20c4', t: 'El cuadrado', q: 'Escribe <code>cuadrado()</code>: repite 4 veces (for) avanzar con M3/M4 a 150 por 1000 ms y girar (M3=150, M4=−150) por 500 ms. Termina con motor_stop_all().', start: '', sol: 'def cuadrado():\n    for i in range(4):\n        SuperBitV2.motor_run_dual(SuperBitV2.enMotors.M3, 150, SuperBitV2.enMotors.M4, 150)\n        basic.pause(1000)\n        SuperBitV2.motor_run_dual(SuperBitV2.enMotors.M3, 150, SuperBitV2.enMotors.M4, -150)\n        basic.pause(500)\n    SuperBitV2.motor_stop_all()', robot: true,
    test: r`clear(); cuadrado()
ev=E()
assert len([e for e in ev if e[0]=="motors"])==8, "Deben ser 8 órdenes de motores: 4 avances y 4 giros"
assert ev[-1]==("motorstop",), "Termina con motor_stop_all()"
assert "for" in SRC, "Usa un ciclo for"`, hint: 'Dentro del for: avanzar, pausa, girar, pausa.' }),
  QZ({ id: 'l20q1', q: 'M3 = 150 y M4 = −150. ¿Qué hace el robot?', opts: ['Avanza recto', 'Gira en su lugar', 'Retrocede'], a: 1, why: 'Una rueda hacia adelante y la otra hacia atrás: giro en el sitio.' })
] });

  CH({ id: 'l21c4', t: 'Tira de luces', q: 'Crea <code>strip = SuperBitV2.rgb_program()</code> y muestra azul con <code>strip.show_color(neopixel.colors(NeoPixelColors.BLUE))</code>.', start: '', sol: 'strip = SuperBitV2.rgb_program()\nstrip.show_color(neopixel.colors(NeoPixelColors.BLUE))', robot: true,
    test: r`assert ("strip","all",(0,0,255)) in E(), "Debe mostrar el color azul en la tira"`, hint: 'Primero crea la tira y luego llama a show_color.' }),
  QZ({ id: 'l21q1', q: 'rgb(255, 0, 0) produce…', opts: ['Verde', 'Rojo', 'Azul'], a: 1, why: 'El primer valor es el rojo.' })
] });

LESSONS.push({ id: 'l22', lv: 4, t: 'Sensores digitales', lead: 'Ultrasonido, infrarrojo, PIR, colisión, botón, vibración y temperatura/humedad.', b: [
  BOX('vida', 'El ultrasonido es como un murciélago', 'El murciélago grita y, por el eco, sabe qué tan lejos está la pared. El sensor ultrasónico hace lo mismo y te devuelve un <b>número</b>: la distancia.'),
  P('Categoría <b>SuperBitV2_Digital</b>. Se conectan a un par de pines (<code>SuperBitV2_Digital.mwDigitalNum.P4P6</code>, <code>P1P2</code>, <code>P0P3</code>, <code>P10P9</code>, <code>P7P8</code> o <code>P5P11</code>). <code>ultrasonic(pines)</code> devuelve una distancia; <code>ir</code>, <code>pir</code>, <code>collision</code> y <code>button</code> devuelven <b>verdadero o falso</b> según el estado que preguntes; <code>vibration</code> es un evento; <code>dht11value(tipo, pines)</code> da temperatura o humedad.'),

print(distancia)
if SuperBitV2_Digital.ir(SuperBitV2_Digital.mwDigitalNum.P1P2, SuperBitV2_Digital.enObstacle.OBSTACLE):
    basic.show_icon(IconNames.NO)
temp = SuperBitV2_Digital.dht11value(SuperBitV2_Digital.DHT11Type.DHT11_TEMPERATURE_C, SuperBitV2_Digital.mwDigitalNum.P0P3)
basic.show_number(temp)`, { robot: true }),
  P('Mueve el control <b>Ultrasonido</b> de los sensores simulados y vuelve a ejecutar.'),
  CH({ id: 'l22c1', t: 'Robot que frena', q: 'Escribe <code>revisar()</code>: si el ultrasonido (<code>P4P6</code>) mide <b>menos de 15 cm</b>, <code>motor_stop_all()</code>; si no, avanza con M3 y M4 a 120.', start: '', sol: 'def revisar():\n    if SuperBitV2_Digital.ultrasonic(SuperBitV2_Digital.mwDigitalNum.P4P6) < 15:\n        SuperBitV2.motor_stop_all()\n    else:\n        SuperBitV2.motor_run_dual(SuperBitV2.enMotors.M3, 120, SuperBitV2.enMotors.M4, 120)', robot: true,
    test: r`SENS["ultrasonic"]=10; clear(); revisar()
assert ("motorstop",) in E(), "A 10 cm debe detenerse"

/* ── tejer: inserta los recuadros y las actividades en cada lección ── */
function weave() {
  LESSONS.forEach(l => {
    const x = EXTRA[l.id]; if (!x) return;
    const kinds = l.b.map(b => b[0]);
    if (x.dual && x.dual.length) { let at = kinds.indexOf('ex'); if (at < 0) at = Math.min(2, l.b.length); l.b.splice(at, 0, ...x.dual); }
    if (x.acts && x.acts.length) { const k2 = l.b.map(b => b[0]); let at = k2.indexOf('ch'); if (at < 0) at = k2.indexOf('quiz'); if (at < 0) at = l.b.length; l.b.splice(at, 0, ...x.acts); }
  });
}
