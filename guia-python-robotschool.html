<script>
'use strict';
/* ═════════ utilidades ═════════ */
const $ = (s, root) => (root || document).querySelector(s);
const $$ = (s, root) => [...(root || document).querySelectorAll(s)];
const sleep = ms => new Promise(res => setTimeout(res, ms));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2400); }
function confetti() {
  const cols = ['--rbs-teal', '--rbs-red', '--rbs-orange', '--rbs-pink'], cs = getComputedStyle(document.documentElement);
  for (let i = 0; i < 30; i++) { const s = document.createElement('span'); s.className = 'cf'; s.style.left = Math.random() * 100 + 'vw'; s.style.background = cs.getPropertyValue(cols[i % 4]); document.body.appendChild(s);
    s.animate([{ transform: 'translateY(0) rotate(0)', opacity: 1 }, { transform: `translateY(${innerHeight + 30}px) translateX(${(Math.random() - .5) * 200}px) rotate(${Math.random() * 720}deg)`, opacity: .9 }], { duration: 1300 + Math.random() * 1000, easing: 'ease-in' }).onfinish = () => s.remove(); }
}
let AC;
function tone(freq, ms) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = freq; o.connect(g); g.connect(AC.destination); g.gain.value = .06; o.start(); o.stop(AC.currentTime + Math.min(ms, 600) / 1000); } catch (e) {} }
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

/* ═════════ motor de Python (Pyodide en un Worker) ═════════ */
const Engine = (() => {
  const SRC = `importScripts('https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js');
const PRELUDE = ${JSON.stringify(PRELUDE)};
let py;
const ready = (async () => { py = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' }); py.runPython(PRELUDE); postMessage({ ready: true }); })();
onmessage = async e => { await ready; const m = e.data; try { let out = '{}';
  if (m.cmd === 'run') out = py.globals.get('_run')(m.code, m.test || '');
  else if (m.cmd === 'fire') out = py.globals.get('_fire')(m.kind, JSON.stringify(m.args || []));
  else if (m.cmd === 'sens') py.globals.get('_sens')(m.k, m.v);
  postMessage({ id: m.id, out }); } catch (err) { postMessage({ id: m.id, fail: String(err) }); } };`;
  let w = null, readyP = null, seq = 0, chain = Promise.resolve(); const pending = new Map();
  const setChip = (cls, txt) => { const c = $('#eng'); if (c) { c.className = 'chip ' + cls; c.textContent = txt; } };
  function start() {
    setChip('', 'Python: cargando…');
    try { w = new Worker(URL.createObjectURL(new Blob([SRC], { type: 'text/javascript' }))); } catch (e) { w = null; readyP = Promise.reject(e); readyP.catch(() => {}); setChip('err', 'Python: sin motor'); return; }
    readyP = new Promise((res, rej) => {
      w.onmessage = e => { const d = e.data; if (d.ready) { setChip('ready', 'Python: listo ✓'); res(); } else if (pending.has(d.id)) { const p = pending.get(d.id); pending.delete(d.id); clearTimeout(p.t); p.res(d); } };
      w.onerror = ev => { setChip('err', 'Python: sin conexión'); rej(ev); };
    });
    readyP.catch(() => {});
  }
  async function call(m, timeout) {
    if (!w) start();
    try { await readyP; } catch (e) { return { fail: 'No se pudo cargar Python. La primera vez necesitas conexión a internet (se descarga el intérprete, unos 10 MB, y luego queda en caché).' }; }
    return new Promise(res => {
      const id = ++seq, t = setTimeout(() => { pending.delete(id); try { w.terminate(); } catch (e) {} w = null; readyP = null; setChip('', 'Python: reiniciando…'); res({ timeout: true }); start(); }, timeout || 5000);
      pending.set(id, { res, t }); w.postMessage(Object.assign({ id }, m));
    });
  }
  const q = (m, t) => (chain = chain.then(() => call(m, t), () => call(m, t)));
  return { warm: () => { if (!w) start(); }, run: (code, test) => q({ cmd: 'run', code, test }), fire: (kind, args) => q({ cmd: 'fire', kind, args }), sens: (k, v) => q({ cmd: 'sens', k, v }, 8000) };
})();

/* ═════════ simulador (micro:bit + SuperBitV2) ═════════ */
const IC = { HEART: '01010,11111,11111,01110,00100', SMALL_HEART: '00000,01010,01110,00100,00000', HAPPY: '00000,01010,00000,10001,01110', SAD: '00000,01010,00000,01110,10001', YES: '00000,00001,00010,10100,01000', NO: '10001,01010,00100,01010,10001', ANGRY: '10001,01010,00000,11111,10101', SURPRISED: '01010,00000,00100,01010,00100', ASLEEP: '00000,11011,00000,01110,00000', CONFUSED: '00000,01010,00000,01010,10101', SKULL: '01110,10101,11111,01110,01110', GHOST: '11111,10101,11111,11111,10101' };
const DG = ['01110,10001,10001,10001,01110', '00100,01100,00100,00100,01110', '01110,10001,00110,01000,11111', '11110,00001,01110,00001,11110', '10010,10010,11111,00010,00010', '11111,10000,11110,00001,11110', '01110,10000,11110,10001,01110', '11111,00010,00100,01000,01000', '01110,10001,01110,10001,01110', '01110,10001,01111,00001,01110'];
const MINUS = '00000,00000,01110,00000,00000', DOT = '00000,00000,00000,00000,00100';
const P2 = s => s.replace(/,/g, '').split('').map(c => c === '1');
const NAMES = { RED: [255, 0, 0], GREEN: [0, 200, 0], BLUE: [0, 0, 255], WHITE: [255, 255, 255], CYAN: [0, 220, 220], PINKISH: [255, 105, 180], YELLOW: [255, 220, 0], OFF: [229, 231, 235] };
const SENS_DEF = [['temperature', 'Temperatura °C', 10, 40, 24], ['light_level', 'Nivel de luz (micro:bit)', 0, 255, 128], ['sound_level', 'Nivel de sonido (micro:bit)', 0, 255, 40], ['compass', 'Brújula °', 0, 359, 0],
  ['ultrasonic', 'Ultrasonido (cm)', 2, 200, 40], ['potentiometer', 'Potenciómetro', 0, 1023, 512], ['light', 'Luz (SuperBit analógico)', 0, 1023, 512], ['sound', 'Sonido (SuperBit analógico)', 0, 1023, 300], ['humidity', 'Humedad %', 0, 100, 55]];
const SENS_CK = [['ir_obstacle', 'IR detecta obstáculo'], ['pir', 'PIR detecta movimiento'], ['collision', 'Sensor de colisión'], ['button', 'Botón externo presionado'], ['btn_A', 'Mantener botón A'], ['btn_B', 'Mantener botón B']];

function createSim(root) {
  root.innerHTML = `<div class="sim"><h5>Simulador del micro:bit y del robot</h5>
    <div class="sim-top"><div class="mb"><div class="sim-txt"></div><div class="mb-leds">${'<i></i>'.repeat(25)}</div><div class="mb-gold"></div></div>
    <div><div class="sim-btns"><button class="big" data-f="button:A" type="button" aria-label="Botón A">A</button><button class="big" data-f="button:B" type="button" aria-label="Botón B">B</button><button data-f="button:AB" type="button">A+B</button><button data-f="gesture:SHAKE" type="button">📳 Agitar</button><button data-f="forever" type="button">♾ forever ×3</button><button data-f="vibration" type="button">Vibración</button></div>
    <div class="dev"></div></div></div>
    <details class="sens"><summary>Sensores simulados y radio</summary><div class="sg"></div>
    <div class="row" style="margin-top:10px"><label>Radio recibido:&nbsp;<input type="number" class="rn" value="1" style="width:70px"></label><button class="btn sec sm rsn" type="button">Enviar número</button><input type="text" class="rs" value="hola" style="width:90px"><button class="btn sec sm rss" type="button">Enviar texto</button></div></details>
    <div class="slog" aria-live="polite"></div></div>`;
  const leds = $$('.mb-leds i', root), txt = $('.sim-txt', root), dev = $('.dev', root), log = $('.slog', root), sg = $('.sg', root);
  let mat = Array(25).fill(false), gen = 0; const servos = {}, motors = {}; let rgb = null, strip = null, msg = '';
  const draw = () => leds.forEach((l, i) => l.classList.toggle('on', !!mat[i]));
  const setPat = p => { mat = P2(p); draw(); };
  const addLog = (t, w) => { const d = document.createElement('div'); d.textContent = t; if (w) d.className = 'w'; log.appendChild(d); while (log.children.length > 60) log.firstChild.remove(); log.scrollTop = log.scrollHeight; };
  function devUpdate() {
    let h = '';
    Object.keys(servos).forEach(k => { const s = servos[k]; h += `<div class="dv">⚙ ${k}<span class="gbar"><i style="width:${s.deg / s.top * 100}%"></i></span>${s.deg}°</div>`; });
    Object.keys(motors).forEach(k => { const v = motors[k]; h += `<div class="dv"><span class="wheel ${v ? 'spin' : ''} ${v < 0 ? 'rev' : ''}" style="animation-duration:${v ? Math.max(.25, 1.6 - Math.abs(v) / 180) : 1}s"></span>${k} ${v}</div>`; });
    if (rgb) h += `<div class="dv"><span class="sw" style="background:rgb(${rgb.join(',')})"></span>RGB</div>`;
    if (strip) h += `<div class="dv"><span class="sw" style="background:rgb(${strip.join(',')})"></span>Tira</div>`;
    if (msg) h += `<div class="dv">${msg}</div>`;
    dev.innerHTML = h;
  }
  function reset() { gen++; mat = Array(25).fill(false); draw(); txt.textContent = ''; for (const k in servos) delete servos[k]; for (const k in motors) delete motors[k]; rgb = null; strip = null; msg = ''; log.innerHTML = ''; devUpdate(); }
  async function showNum(n) { const s = String(n).replace('.', '.'); for (const ch of s) { setPat(ch === '-' ? MINUS : ch === '.' ? DOT : (DG[+ch] || DG[0])); if (s.length > 1) await sleep(380); } }
  async function play(events, quick) {
    const my = ++gen; let last = null;
    for (const ev of events || []) {
      if (my !== gen) return;
      const [t, k, a, b, c, d] = ev;
      if (last !== null && t > last && !quick) await sleep(Math.min(t - last, 700));
      last = t;
      switch (k) {
        case 'icon': setPat(IC[a] || '11111,10001,10101,10001,11111'); addLog('🙂 icono ' + a); break;
        case 'num': addLog('🔢 número ' + a); await showNum(a); break;
        case 'str': txt.textContent = '“' + a + '”'; addLog('🔤 texto "' + a + '"'); setTimeout(() => { if (my === gen) txt.textContent = ''; }, 1500); break;
        case 'leds': setPat(String(a).replace(/[#]/g, '1').replace(/[. ]/g, '0').replace(/\n/g, '')); break;
        case 'clear': mat = Array(25).fill(false); draw(); addLog('🧹 pantalla limpia'); break;
        case 'plot': mat[b * 5 + a] = true; draw(); break; case 'unplot': mat[b * 5 + a] = false; draw(); break; case 'toggle': mat[b * 5 + a] = !mat[b * 5 + a]; draw(); break;
        case 'bar': mat = Array(25).fill(false); for (let i = 0; i < Math.round(a / (b || 1) * 25); i++) mat[24 - i] = true; draw(); break;
        case 'brightness': $('.mb-leds', root).style.opacity = .3 + .7 * (a / 255); break;
        case 'servo': servos[a] = { deg: b, top: c }; addLog(`⚙ servo ${a} → ${b}°`); devUpdate(); break;
        case 'servo360': addLog(`⚙ servo 360° ${a}: ${b} ${c}`); break;
        case 'motors': motors[a] = b; motors[c] = d; addLog(`🛞 ${a}=${b}  ${c}=${d}`); devUpdate(); break;
        case 'motor': motors[a] = b; addLog(`🛞 ${a}=${b}`); devUpdate(); break;
        case 'motorstop': for (const m in motors) motors[m] = 0; addLog('🛑 motores detenidos'); devUpdate(); break;
        case 'music': addLog('🎵 melodía ' + a); { let h = 0; for (const ch of a) h += ch.charCodeAt(0); [0, 3, 5, 8].forEach((o, i) => setTimeout(() => tone(330 * Math.pow(2, ((h % 7) + o) / 12), 160), i * 190)); } break;
        case 'tone': addLog(`🎵 tono ${a} Hz ${b} ms`); tone(a, b || 300); break;
        case 'tempo': addLog('⏱ tempo ' + a); break;
        case 'rgb': rgb = [a, b, c]; addLog(`💡 RGB ${a},${b},${c}`); devUpdate(); break;
        case 'rgbname': rgb = NAMES[a] || NAMES.OFF; addLog('💡 RGB ' + a); devUpdate(); break;
        case 'strip': if (a === 'all') { strip = b; addLog('💡 tira ' + JSON.stringify(b)); devUpdate(); } break;
        case 'radio': addLog('📡 envía ' + a + ': ' + [b, c].filter(x => x !== undefined && x !== null).join(', ')); break;
        case 'radiogroup': addLog('📡 grupo ' + a); break;
        case 'serial': addLog('⌨ serial: ' + a); break;
        case 'pin': addLog(`🔌 ${a} ${b} = ${c}`); break;
        case 'vibmot': addLog(`📳 vibración ${a} ${b}`); break;
        case 'buzzerpin': addLog('🔊 zumbador en ' + a); break;
        case 'warn': addLog('⚠ ' + a, true); break;
        case 'reset': addLog('↺ control.reset()'); break;
        case 'pause': break;
      }
    }
  }
  SENS_DEF.forEach(([k, lab, mn, mx, df]) => { const l = document.createElement('label'); l.innerHTML = `${lab}: <b>${df}</b><input type="range" min="${mn}" max="${mx}" value="${df}" data-k="${k}">`; sg.appendChild(l); });
  SENS_CK.forEach(([k, lab]) => { const l = document.createElement('label'); l.className = 'ck'; l.innerHTML = `<input type="checkbox" data-k="${k}"> ${lab}`; sg.appendChild(l); });
  { const l = document.createElement('label'); l.innerHTML = `Joystick: <select data-k="rocker"><option>NO_STATE</option><option>UP</option><option>DOWN</option><option>LEFT</option><option>RIGHT</option></select>`; sg.appendChild(l); }
  const val = el => el.type === 'checkbox' ? el.checked : el.type === 'range' ? +el.value : el.value;
  sg.addEventListener('input', e => { const el = e.target; if (el.type === 'range') $('b', el.parentNode).textContent = el.value; Engine.sens(el.dataset.k, val(el)); });
  const pushSens = () => $$('[data-k]', sg).forEach(el => Engine.sens(el.dataset.k, val(el)));
  async function fire(kind, args) {
    const r = await Engine.fire(kind, args); if (r.timeout) { addLog('⏱ el evento tardó demasiado', true); return; } if (r.fail) { addLog(r.fail, true); return; }
    const d = JSON.parse(r.out); if (d.stdout) d.stdout.trim().split('\n').forEach(x => addLog('print: ' + x)); if (d.error) addLog('❌ ' + d.error, true); await play(d.log);
  }
  $$('[data-f]', root).forEach(b => b.onclick = () => { const f = b.dataset.f; fire(f === 'forever' ? 'forever' : f, []); });
  $('.rsn', root).onclick = () => fire('radio:number', [+$('.rn', root).value]);
  $('.rss', root).onclick = () => fire('radio:string', [$('.rs', root).value]);
  return { play, reset, pushSens, addLog };
}

/* ═════════ progreso ═════════ */
const ALL_IDS = []; LESSONS.forEach(l => l.b.forEach(([k, d]) => { if (k === 'ch' || k === 'quiz' || k === 'viz') ALL_IDS.push(d.id); }));
const done = new Set(store.get('rbs-py-done', []));
function isDone(id) { return done.has(id); }
function lessonProg(l) { const ids = l.b.filter(([k]) => k === 'ch' || k === 'quiz' || k === 'viz').map(([, d]) => d.id); return [ids.filter(isDone).length, ids.length]; }
function complete(id) { if (done.has(id)) return false; done.add(id); store.set('rbs-py-done', [...done]); refreshProgress(); return true; }
function refreshProgress() {
  $('#pbar').style.width = (done.size / ALL_IDS.length * 100) + '%'; $('#score').textContent = `⭐ ${done.size}/${ALL_IDS.length}`;
  $$('.nv[data-l]').forEach(b => { const l = LESSONS.find(x => x.id === b.dataset.l), [a, n] = lessonProg(l); b.classList.toggle('ok', a === n); $('small', b).textContent = `${a}/${n}`; });
}

/* ═════════ editor ═════════ */
function createEditor(host, o) {
  const key = 'rbs-py-code:' + (o.id || o.key);
  const saved = o.id ? store.get(key, null) : null;
  host.innerHTML = `<div class="ed"><div class="ed-bar"><span class="dots"><i style="background:var(--rbs-red)"></i><i style="background:var(--rbs-warning)"></i><i style="background:var(--rbs-success)"></i></span><span>mi_codigo.py</span><span class="ed-st"></span></div>
    <textarea class="ta" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Editor de código Python"></textarea>
    <div class="ed-btns"><button class="btn teal sm run" type="button">▶ Ejecutar</button>${o.test ? '<button class="btn sm chk" type="button">✔ Comprobar</button>' : ''}<button class="btn sec sm rst" type="button">↺ Reiniciar</button>${o.hint ? '<button class="btn sec sm hnt" type="button">💡 Pista</button>' : ''}${o.sol ? '<button class="btn sec sm sbt" type="button" disabled title="Se activa después de un intento">👁 Solución</button>' : ''}<button class="btn sec sm dl" type="button">⬇ .py</button></div>
    <div class="res"><pre class="out"></pre><div class="m"></div><div class="sol"></div></div><div class="simhost"></div></div>`;
  const ta = $('.ta', host), out = $('.out', host), m = $('.m', host), st = $('.ed-st', host);
  ta.value = saved !== null ? saved : o.code; const fit = () => { ta.rows = Math.min(24, Math.max(3, ta.value.split('\n').length + 1)); }; fit();
  const sim = o.robot ? createSim($('.simhost', host)) : null; let tries = 0;
  const say = (cls, t) => { m.className = 'm msg ' + cls; m.textContent = t; };
  ta.addEventListener('input', () => { fit(); if (o.id) store.set(key, ta.value); });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('    ', s, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); }
    else if (e.key === 'Enter' && !e.ctrlKey) { const s = ta.selectionStart, ln = ta.value.slice(0, s).split('\n').pop(), ind = (ln.match(/^ */) || [''])[0] + (/:\s*$/.test(ln) ? '    ' : ''); e.preventDefault(); ta.setRangeText('\n' + ind, s, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); }
    else if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); go(false); }
  });
  async function go(check) {
    st.textContent = 'ejecutando…'; out.textContent = ''; m.className = 'm'; m.textContent = '';
    if (sim) sim.reset();
    const r = await Engine.run(ta.value, check ? o.test : ''); st.textContent = '';
    if (r.timeout) { say('bad', '⏱ Tu programa tardó más de 5 segundos y lo detuve. ¿Hay un ciclo infinito? Revisa que algo cambie dentro del while.'); tries++; unlock(); return; }
    if (r.fail) { say('bad', r.fail); return; }
    const d = JSON.parse(r.out); out.textContent = d.stdout || '';
    if (!d.ok) { say('bad', '❌ ' + d.error); tries++; unlock(); }
    else if (check) {
      tries++; unlock();
      if (d.test && d.test[0]) { say('ok', '✅ ¡Reto superado!'); const first = complete(o.id); host.closest('.ch') && host.closest('.ch').classList.add('done'); if (first) { toast('¡Reto superado! ⭐'); confetti(); } }
      else say('bad', '🔎 Casi: ' + (d.test ? d.test[1] : 'revisa el enunciado.'));
    } else say('info', '▶ Se ejecutó sin errores.' + (o.robot ? ' Usa los botones del simulador.' : ''));
    if (sim) { sim.pushSens(); await sim.play(d.log, false); }
  }

/* ═════════ de bloques a código: dibujo de bloques y actividades de escritura ═════════ */
function bhtml(nodes) {
  return nodes.map(n => { const [c, t, k] = n; const txt = esc(t).replace(/\{([^}]*)\}/g, (_, x) => `<span class="pl2">${x}</span>`);
    return `<div class="mk ${c}"><div class="mkt">${txt}</div>${k ? `<div class="mkk">${bhtml(k)}</div>` : ''}</div>`; }).join('');
}
const normc = s => String(s).replace(/\s+/g, '').replace(/'/g, '"');
const shuf = a => { const b = a.slice(); let n = 0; do { for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } n++; } while (b.length > 1 && n < 20 && b.every((x, i) => x === a[i])); return b; };
const normOut = s => String(s).split('\n').map(x => x.trim()).join('\n').trim();
const txtKey = d => 'rbs-py-txt:' + d.id;

/* traducir un bloque a código escribiendo */
VIZ.traduce = (host, finish, d) => {
  const items = d.cfg.items; let i = 0, fails = 0;
  host.insertAdjacentHTML('beforeend', '<div class="stage"><div class="tq"></div></div>'); const box = $('.tq', host);
  const show = () => {
    if (i >= items.length) { box.innerHTML = '<div class="res-box ok">🎉 ¡Traduciste todos los bloques a código!</div>'; finish(); return; }
    const it = items[i]; fails = 0;
    box.innerHTML = `<p><b>Bloque ${i + 1} de ${items.length}.</b> Así se veía con bloques. Escríbelo como código:</p><div class="mkw">${bhtml(it.b)}</div><input type="text" class="wide ta2" placeholder="escribe el código aquí" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="row" style="margin-top:8px"><button class="btn sm chk2" type="button">Revisar</button><button class="btn sec sm hn2" type="button">💡 Pista</button></div><div class="res-box rr"></div>`;
    const inp = $('.ta2', box), out = $('.rr', box);
    const check = () => { if (it.a.some(a => normc(a) === normc(inp.value))) { out.className = 'res-box ok rr'; out.innerHTML = '✅ ¡Correcto! ' + (it.why || ''); tone(880, 90); i++; setTimeout(show, 1400); }
      else { fails++; out.className = 'res-box bad rr'; out.innerHTML = '🔎 Todavía no. ' + (fails >= 2 ? 'Una forma correcta es: <code>' + esc(it.a[0]) + '</code>' : 'Revisa paréntesis, puntos y mayúsculas.'); sh(out); } };
    $('.chk2', box).onclick = check; inp.onkeydown = e => { if (e.key === 'Enter') check(); };
    $('.hn2', box).onclick = () => { out.className = 'res-box info rr'; out.innerHTML = '💡 ' + (it.hint || 'Lo que estaba en la casilla blanca va como argumento, entre paréntesis.'); };
  };
  show();
};

/* ordenar líneas de código */
VIZ.ordenar = (host, finish, d) => {
  const L = d.cfg.lines; let bank = shuf(L), ans = [];
  host.insertAdjacentHTML('beforeend', '<div class="stage"><b>Líneas desordenadas (toca para usarlas):</b><div class="bank"></div><b>Tu programa (toca una línea para quitarla):</b><pre class="code ans"></pre><div class="row"><button class="btn sm ok2" type="button">Comprobar</button><button class="btn sec sm ck2" type="button">↺ Empezar de nuevo</button></div><div class="res-box rs"></div></div>');
  const draw = () => {
    $('.bank', host).innerHTML = bank.map((t, k) => `<button class="ln" data-k="${k}" type="button">${esc(t)}</button>`).join('') || '<span class="note">(ya usaste todas)</span>';
    $('.ans', host).innerHTML = ans.map((t, k) => `<span class="al" data-k="${k}">${esc(t)}</span>`).join('\n') || '# aquí va tu programa';
    $$('.ln', host).forEach(b => b.onclick = () => { ans.push(bank[+b.dataset.k]); bank.splice(+b.dataset.k, 1); draw(); });
    $$('.al', host).forEach(b => b.onclick = () => { bank.push(ans[+b.dataset.k]); ans.splice(+b.dataset.k, 1); draw(); });
  };
  $('.ok2', host).onclick = () => { const o = $('.rs', host);
    if (ans.length === L.length && ans.every((x, k) => x === L[k])) { o.className = 'res-box ok rs'; o.textContent = '✅ ¡Ordenado! Mira cómo cada línea depende de la anterior y cómo la sangría las agrupa.'; finish(); }
    else { const bad = ans.findIndex((x, k) => x !== L[k]); o.className = 'res-box bad rs'; o.textContent = ans.length < L.length ? '🔎 Aún faltan líneas por poner.' : `🔎 La línea ${bad + 1} no va ahí. Pregúntate: ¿qué tiene que pasar primero?`; sh(o); } };
  $('.ck2', host).onclick = () => { bank = shuf(L); ans = []; draw(); $('.rs', host).textContent = ''; $('.rs', host).className = 'res-box rs'; };
  draw();
};

/* armar un programa con bloques y ver el código */
VIZ.armar = (host, finish, d) => {
  const c = d.cfg; let prog = [];
  const lab = p => esc(p.t).replace(/\{([^}]*)\}/g, '<span class="pl2">$1</span>');
  host.insertAdjacentHTML('beforeend', `<div class="stage"><p><b>Misión:</b> ${c.goal}</p><div class="grid3b"><div><b>🧩 Bloques (toca para agregar)</b><div class="pal2"></div></div><div><b>Tu programa en bloques (toca uno para quitarlo)</b><div class="mkw prg"></div></div><div><b>⌨️ Y así se escribe en código</b><pre class="code pyo"></pre></div></div><div class="row"><button class="btn sm ck7" type="button">Comprobar</button><button class="btn sec sm cl7" type="button">Limpiar</button></div><div class="res-box rr"></div></div>`);
  $('.pal2', host).innerHTML = c.palette.map(p => `<button class="mkb ${p.c}" data-id="${p.id}" type="button">${lab(p)}</button>`).join('');
  const draw = () => { $('.prg', host).innerHTML = (c.wrap ? `<div class="mk input"><div class="mkt">${esc(c.wrap.label)}</div><div class="mkk">` : '') + (prog.length ? prog.map((id, i) => { const p = c.palette.find(x => x.id === id); return `<div class="mk ${p.c} rm" data-i="${i}"><div class="mkt">${lab(p)}</div></div>`; }).join('') : '<span class="note">Aún no hay bloques</span>') + (c.wrap ? '</div></div>' : '');
    const body = prog.map(id => c.palette.find(x => x.id === id).py);
    $('.pyo', host).textContent = (c.wrap ? c.wrap.head + '\n' + (body.length ? body.map(l => '    ' + l).join('\n') : '    pass') + '\n' + c.wrap.tail : body.join('\n')) || '# agrega bloques';
    $$('.rm', host).forEach(b => b.onclick = () => { prog.splice(+b.dataset.i, 1); draw(); }); };
  $$('.mkb', host).forEach(b => b.onclick = () => { prog.push(b.dataset.id); draw(); });
  $('.cl7', host).onclick = () => { prog = []; draw(); };
  $('.ck7', host).onclick = () => { const o = $('.rr', host), T = c.target[0] instanceof Array ? c.target : [c.target], ok = T.some(t => t.length === prog.length && t.every((x, i) => x === prog[i]));
    if (ok) { o.className = 'res-box ok rr'; o.textContent = '✅ ¡Lo armaste! Compara cada bloque con su línea de código: es la misma idea escrita de otra forma.'; finish(); } else { o.className = 'res-box bad rr'; o.textContent = '🔎 Todavía no cumple la misión. Revisa el orden y que no sobre ni falte ningún bloque.'; sh(o); } };
  draw();
};

/* 1 · robot en un laberinto: hay que ser exacto */
VIZ.ruta = (host, finish, d) => {
  const LV = d.cfg.levels, showCode = !!d.cfg.code; let li = 0, prog = [], busy = false, nn = 1;
  const DX = { N: 0, E: 1, S: 0, W: -1 }, DY = { N: -1, E: 0, S: 1, W: 0 }, ORDER = ['N', 'E', 'S', 'W'], DEG = { N: 0, E: 90, S: 180, W: 270 };
  host.insertAdjacentHTML('beforeend', `<div class="stage"><p class="lvt"></p><div class="rt"><div><div class="rgrid"></div></div><div class="rside"><b>Instrucciones disponibles</b><div class="rpal"><label>Avanzar <input type="number" class="nn" value="1" min="1" max="9" style="width:54px"> casilla(s)</label><button class="btn sm cf" type="button">⬆ Avanzar</button><button class="btn sec sm cr" type="button">↪ Girar a la derecha 90°</button><button class="btn sec sm cl" type="button">↩ Girar a la izquierda 90°</button><button class="btn sec sm cv" type="button">🚶 «Camina»</button></div><b>Tu programa (toca una para quitarla)</b><ol class="plist"></ol>${showCode ? '<b>En código se vería así:</b><pre class="code pl2c"></pre>' : ''}</div></div><div class="row"><button class="btn sm go" type="button">▶ Ejecutar</button><button class="btn sec sm cc" type="button">🗑 Borrar todo</button></div><div class="res-box rr">Escribe tus instrucciones y presiona ▶.</div></div>`);
  const lv = () => LV[li];
  let bot = null;
  function cell(x, y) { return lv().walls.some(w => w[0] === x && w[1] === y); }
  function drawGrid() { const L = lv(); const g = $('.rgrid', host); g.style.gridTemplateColumns = `repeat(${L.size}, 44px)`; let h = '';
    for (let y = 0; y < L.size; y++) for (let x = 0; x < L.size; x++) { let c = ''; if (cell(x, y)) c = '🧱'; else if (L.goal[0] === x && L.goal[1] === y) c = '⭐'; if (bot && bot.x === x && bot.y === y) c += `<span class="botc" style="transform:rotate(${bot.deg}deg)">▲</span>`; h += `<div class="rc ${cell(x, y) ? 'wall' : ''}">${c}</div>`; }
    g.innerHTML = h; }
  function resetBot() { const L = lv(); bot = { x: L.start[0], y: L.start[1], dir: L.dir, deg: DEG[L.dir] }; drawGrid(); }
  const txt = c => c.t === 'f' ? `Avanzar ${c.n} casilla${c.n > 1 ? 's' : ''}` : c.t === 'r' ? 'Girar a la derecha 90°' : c.t === 'l' ? 'Girar a la izquierda 90°' : '«Camina»';
  function drawProg(active) { $('.plist', host).innerHTML = prog.map((c, i) => `<li class="${i === active ? 'act' : ''} ${c.t === 'v' ? 'vag' : ''}" data-i="${i}">${txt(c)}</li>`).join('') || '<li class="note">(vacío)</li>';
    $$('.plist li[data-i]', host).forEach(li2 => li2.onclick = () => { if (busy) return; prog.splice(+li2.dataset.i, 1); drawProg(-1); });
    if (showCode) $('.pl2c', host).textContent = 'ruta = [\n' + prog.map(c => '    ' + (c.t === 'f' ? `("avanzar", ${c.n}),` : c.t === 'r' ? '("girar_derecha", 90),' : c.t === 'l' ? '("girar_izquierda", 90),' : '("camina", ???),   # ¿cuánto? ¿hacia dónde?')).join('\n') + '\n]'; }
  function title() { const L = lv(); $('.lvt', host).innerHTML = `<b>Misión ${li + 1} de ${LV.length}:</b> ${L.t}`; }
  const add = c => { if (busy) return; prog.push(c); drawProg(-1); };
  $('.cf', host).onclick = () => add({ t: 'f', n: Math.max(1, Math.min(9, +$('.nn', host).value || 1)) }); $('.cr', host).onclick = () => add({ t: 'r' }); $('.cl', host).onclick = () => add({ t: 'l' }); $('.cv', host).onclick = () => add({ t: 'v' });
  $('.cc', host).onclick = () => { if (busy) return; prog = []; resetBot(); drawProg(-1); $('.rr', host).className = 'res-box rr'; $('.rr', host).textContent = 'Programa borrado.'; };
  $('.go', host).onclick = async () => { if (busy) return; busy = true; resetBot(); const o = $('.rr', host); const L = lv(); await sleep(250);
    for (let i = 0; i < prog.length; i++) { const c = prog[i]; drawProg(i); await sleep(350);
      if (c.t === 'v') { o.className = 'res-box bad rr'; o.innerHTML = '❓ El robot dice: «No entiendo "camina". ¿Cuántas casillas? ¿Hacia dónde?». Un robot necesita instrucciones EXACTAS.'; sh(o); busy = false; drawProg(i); return; }
      if (c.t === 'r' || c.t === 'l') { bot.deg += c.t === 'r' ? 90 : -90; bot.dir = ORDER[(ORDER.indexOf(bot.dir) + (c.t === 'r' ? 1 : 3)) % 4]; drawGrid(); await sleep(350); }
      else { for (let k = 0; k < c.n; k++) { const nx = bot.x + DX[bot.dir], ny = bot.y + DY[bot.dir];
          if (nx < 0 || ny < 0 || nx >= L.size || ny >= L.size || cell(nx, ny)) { o.className = 'res-box bad rr'; o.innerHTML = `💥 En la instrucción ${i + 1} el robot chocó (con una pared o con el borde). Revisa cuántas casillas puede avanzar.`; sh(o); busy = false; drawProg(i); return; }
          bot.x = nx; bot.y = ny; drawGrid(); tone(300 + k * 40, 90); await sleep(320); } } }
    drawProg(-1);
    if (bot.x === L.goal[0] && bot.y === L.goal[1]) { o.className = 'res-box ok rr'; o.textContent = '⭐ ¡Llegó a la meta! Tus instrucciones fueron lo bastante exactas.'; tone(880, 120); li++; if (li >= LV.length) { finish(); busy = false; return; } await sleep(1300); prog = []; title(); resetBot(); drawProg(-1); o.className = 'res-box info rr'; o.textContent = 'Nueva misión. ¡Ahora el camino es más difícil!'; }
    else { o.className = 'res-box bad rr'; o.textContent = `El robot terminó en la columna ${bot.x + 1}, fila ${bot.y + 1}; la meta está en la columna ${L.goal[0] + 1}, fila ${L.goal[1] + 1}. Cuenta las casillas con cuidado.`; sh(o); }
    busy = false; };
  title(); resetBot(); drawProg(-1);
};

/* 2 · el robot literal: el sándwich */
VIZ.sandwich = (host, finish, d) => {
  const S = [
    { q: 'Paso 1 · Conseguir el pan', ic: '🍞', o: [['Toma pan.', 'v', '🤖 «¿Cuánto pan? ¿Una bolsa entera? ¿Del estante o del piso?» (Ordenaste algo vago y el robot no sabe qué hacer.)'], ['Toma 2 rebanadas de pan y colócalas sobre el plato, una al lado de la otra.', 'ok', '🤖 «Entendido. Dos rebanadas en el plato.»'], ['Pon el pan en el techo.', 'x', '🤖 Ejecuta tu orden al pie de la letra… y el pan queda en el techo. 😬']] },
    { q: 'Paso 2 · Abrir el frasco de mantequilla', ic: '🫙', o: [['Abre el frasco.', 'v', '🤖 «¿Con qué mano? ¿Girando hacia dónde? ¿Hasta cuándo?» Le faltan detalles.'], ['Sujeta el frasco con la mano izquierda, gira la tapa hacia la izquierda con la derecha hasta que se suelte y déjala sobre la mesa.', 'ok', '🤖 «Entendido. Frasco abierto.»'], ['Golpea el frasco contra la mesa.', 'x', '🤖 Ejecuta… y ahora hay vidrio por toda la mesa. 😬']] },
    { q: 'Paso 3 · Untar', ic: '🔪', o: [['Unta la mantequilla.', 'v', '🤖 «¿Cuánta? ¿Con qué? ¿Sobre cuál rebanada? ¿En qué parte?»'], ['Con el cuchillo toma una cucharada de mantequilla y extiéndela sobre toda la superficie de UNA rebanada, hasta los bordes.', 'ok', '🤖 «Entendido. Una rebanada untada.»'], ['Pon el frasco encima del pan.', 'x', '🤖 Ejecuta… y el frasco aplasta el pan. 😬']] },
    { q: 'Paso 4 · Cerrar el sándwich', ic: '🥪', o: [['Junta el pan.', 'v', '🤖 «¿Cuál con cuál? ¿Con la mantequilla hacia dónde?»'], ['Coloca la rebanada sin mantequilla sobre la rebanada untada, con los bordes alineados.', 'ok', '🤖 «Entendido. Sándwich armado.»'], ['Dobla el pan por la mitad.', 'x', '🤖 Ejecuta… y el pan se rompe. 😬']] },
    { q: 'Paso 5 · Servir', ic: '🍽️', o: [['Sírvelo.', 'v', '🤖 «¿Entero o en pedazos? ¿En qué plato? ¿Dónde?»'], ['Corta el sándwich por la mitad en diagonal y colócalo en un plato limpio, en el centro de la mesa.', 'ok', '🤖 «Entendido. ¡Sándwich servido!»'], ['Tíralo al piso.', 'x', '🤖 Ejecuta… y el sándwich cae. 😬']] }];
  let i = 0, built = '';
  host.insertAdjacentHTML('beforeend', '<div class="stage"><p class="note">Eres el programador. El robot hará <b>exactamente</b> lo que escribas, ni más ni menos, y no adivina nada. Elige la instrucción que sí le sirve.</p><div class="sand"></div><div class="opts2"></div><div class="res-box rr"></div></div>');
  const draw = () => { $('.sand', host).innerHTML = `<div class="sbar">${S.map((s, k) => `<span class="${k < i ? 'on' : ''}">${s.ic}</span>`).join('<b>→</b>')}</div>`;
    if (i >= S.length) { $('.opts2', host).innerHTML = ''; $('.rr', host).className = 'res-box ok rr'; $('.rr', host).textContent = '🥪 ¡Sándwich listo! Fíjate: cada instrucción exacta decía QUÉ, CUÁNTO, CON QUÉ y DÓNDE. Eso es programar.'; finish(); return; }
    const s = S[i]; $('.opts2', host).innerHTML = `<b>${s.q}</b>` + shuf(s.o).map(op => `<button class="ob" data-k="${op[1]}" data-r='${op[2].replace(/'/g, '&#39;')}' type="button">${esc(op[0])}</button>`).join('');
    $$('.ob', host).forEach(b => b.onclick = () => { const r = $('.rr', host); r.innerHTML = b.dataset.r; if (b.dataset.k === 'ok') { r.className = 'res-box ok rr'; tone(880, 90); i++; setTimeout(draw, 1500); } else { r.className = 'res-box bad rr'; sh(r); tone(220, 160); } }); };
  draw();
};

/* 3 · ¿qué le falta a la orden? */
VIZ.faltan = (host, finish, d) => {
  const A = ['Qué hacer (la acción)', 'Cuánto (distancia, tiempo, grados, fuerza)', 'Hacia dónde (la dirección)', 'Cuándo (en qué momento empezar o parar)', 'Nada: ya está completa'];
  const Q = d.cfg.items; let i = 0;
  host.insertAdjacentHTML('beforeend', '<div class="stage"><div class="fq"></div></div>');
  const show = () => { if (i >= Q.length) { $('.fq', host).innerHTML = '<div class="res-box ok">🎉 ¡Ya piensas como un programador: detectas lo que falta!</div>'; finish(); return; }
    const q = Q[i]; $('.fq', host).innerHTML = `<p><b>Orden ${i + 1} de ${Q.length}:</b> <span class="said">«${q.o}»</span></p><p>¿Qué le falta a esta orden para que el robot la cumpla bien? (marca todo lo que falte)</p>${A.map((a, k) => `<label class="ck2"><input type="checkbox" data-k="${k}"> ${a}</label>`).join('')}<div class="row" style="margin-top:8px"><button class="btn sm cq" type="button">Revisar</button></div><div class="res-box rr"></div>`;
    $('.cq', host).onclick = () => { const sel = $$('input:checked', host).map(x => +x.dataset.k).sort().join(','), want = q.m.slice().sort().join(','), o = $('.rr', host);
      if (sel === want) { o.className = 'res-box ok rr'; o.innerHTML = '✅ ¡Exacto! ' + q.why; tone(880, 90); i++; setTimeout(show, 2200); } else { o.className = 'res-box bad rr'; o.innerHTML = '🔎 Casi. Piensa: si fueras el robot, ¿qué preguntarías antes de moverte?'; sh(o); } }; };
  show();
};

/* 4 · instruye al robot en una pista: cuánto y hasta cuándo */
VIZ.especifico = (host, finish, d) => {
  const R = [4, 9, 6]; let ri = 0, prog = [], busy = false;
  host.insertAdjacentHTML('beforeend', `<div class="stage"><p class="et"></p><div class="trk"><div class="tkl"></div><div class="tbot" style="left:0">🤖</div><div class="tflag">🚩</div></div><div class="row" style="margin:10px 0"><label>Acción <select class="ea"><option value="f">avanzar</option><option value="b">retroceder</option></select></label><label>cuántos pasos <input type="number" class="en" min="1" max="12" style="width:64px" placeholder="?"></label><button class="btn sm ead" type="button">➕ Agregar</button><button class="btn sec sm es" type="button">✋ Agregar «detenerse»</button><button class="btn sec sm ev" type="button">«Avanza» (sin número)</button></div><ol class="plist"></ol><div class="row"><button class="btn sm ego" type="button">▶ Ejecutar</button><button class="btn sec sm ecl" type="button">🗑 Borrar</button></div><div class="res-box rr"></div></div>`);
  const total = 14; const place = (el, p) => { el.style.left = `calc(${p / total * 100}% - 12px)`; };
  const setup = () => { $('.et', host).innerHTML = `<b>Misión ${ri + 1} de ${R.length}:</b> lleva al robot hasta la bandera (paso <b>${R[ri]}</b>) y haz que <b>se detenga</b> ahí.`; $('.tkl', host).innerHTML = Array.from({ length: total + 1 }, (_, k) => `<span style="left:calc(${k / total * 100}% - 4px)">${k}</span>`).join(''); place($('.tflag', host), R[ri]); place($('.tbot', host), 0); prog = []; drawP(); };
  const drawP = () => { $('.plist', host).innerHTML = prog.map((c, i) => `<li data-i="${i}" class="${c.k === 'v' ? 'vag' : ''}">${c.k === 'f' ? 'Avanzar ' + c.n + ' paso(s)' : c.k === 'b' ? 'Retroceder ' + c.n + ' paso(s)' : c.k === 's' ? 'Detenerse' : 'Avanza (¿cuánto?)'}</li>`).join('') || '<li class="note">(vacío)</li>';
    $$('.plist li[data-i]', host).forEach(l => l.onclick = () => { if (busy) return; prog.splice(+l.dataset.i, 1); drawP(); }); };
  $('.ead', host).onclick = () => { if (busy) return; const n = +$('.en', host).value; if (!n) { const o = $('.rr', host); o.className = 'res-box bad rr'; o.textContent = '❓ Falta el número: ¿cuántos pasos? El robot no adivina.'; sh(o); return; } prog.push({ k: $('.ea', host).value, n }); drawP(); };
  $('.es', host).onclick = () => { if (busy) return; prog.push({ k: 's' }); drawP(); }; $('.ev', host).onclick = () => { if (busy) return; prog.push({ k: 'v' }); drawP(); };
  $('.ecl', host).onclick = () => { if (!busy) setup(); };
  $('.ego', host).onclick = async () => { if (busy) return; busy = true; const o = $('.rr', host), bot = $('.tbot', host); let p = 0, stopped = false; place(bot, 0); await sleep(300);
    for (const c of prog) { if (c.k === 'v') { o.className = 'res-box bad rr'; o.textContent = '❓ «Avanza»… ¿cuántos pasos? El robot se queda esperando. Hay que decir CUÁNTO.'; sh(o); busy = false; return; }
      if (c.k === 's') { stopped = true; break; }
      for (let k = 0; k < c.n; k++) { p += c.k === 'f' ? 1 : -1; if (p < 0 || p > total) { o.className = 'res-box bad rr'; o.textContent = '💥 El robot se salió de la pista.'; busy = false; return; } place(bot, p); tone(300 + p * 25, 70); await sleep(260); } }
    if (!stopped) { o.className = 'res-box bad rr'; o.innerHTML = `🏃 El robot llegó al paso ${p}… ¡y siguió caminando! Olvidaste decirle <b>cuándo parar</b>: agrega «detenerse».`; for (let k = 0; k < 3 && p < total; k++) { p++; place(bot, p); await sleep(200); } sh(o); }
    else if (p !== R[ri]) { o.className = 'res-box bad rr'; o.textContent = `🔎 Se detuvo en el paso ${p}, pero la bandera está en el ${R[ri]}. Revisa tus cuentas.`; sh(o); }
    else { o.className = 'res-box ok rr'; o.textContent = '🚩 ¡Llegó exactamente a la bandera y se detuvo! Dijiste QUÉ, CUÁNTO y HASTA CUÁNDO.'; tone(880, 120); ri++; if (ri >= R.length) { finish(); busy = false; return; } await sleep(1500); setup(); o.className = 'res-box info rr'; o.textContent = 'Nueva misión.'; }
    busy = false; };
  setup();
};

/* 5 · girar: cuántos grados y hacia dónde */
VIZ.giro = (host, finish, d) => {
  const R = [90, -90, 180, 45, -135]; let ri = 0, ang = 0, busy = false;
  host.insertAdjacentHTML('beforeend', `<div class="stage"><p class="gt"></p><div class="row" style="align-items:center;gap:20px"><div class="gwrap"><svg viewBox="-110 -110 220 220" class="gsvg"><circle r="95" fill="none" stroke="#D1D5DB" stroke-width="3"/><g class="mk0"></g><g class="bot2"><circle r="28" fill="#009CCC"/><polygon points="0,-44 -14,-26 14,-26" fill="#F97316"/><text y="6" text-anchor="middle" font-size="22">🤖</text></g><g class="flag"><text font-size="26" text-anchor="middle">🚩</text></g></svg></div><div><label>Gira hacia la <select class="gs"><option value="1">derecha</option><option value="-1">izquierda</option></select></label><label>cuántos grados <input type="number" class="gd" min="0" max="360" style="width:74px" placeholder="?"></label><div class="row" style="margin-top:8px"><button class="btn sm gg" type="button">↻ Girar</button><button class="btn sec sm gv" type="button">«Gira» (sin más datos)</button></div><p class="note">0° = mirando hacia arriba. Un giro a la derecha va como las agujas del reloj.</p></div></div><div class="res-box rr"></div></div>`);
  const bot = $('.bot2', host); bot.style.transition = 'transform .8s'; const flag = $('.flag', host);
  const setup = () => { const t = R[ri]; ang = 0; bot.style.transform = 'rotate(0deg)'; const a = t * Math.PI / 180; flag.setAttribute('transform', `translate(${Math.sin(a) * 78} ${-Math.cos(a) * 78})`); $('.gt', host).innerHTML = `<b>Misión ${ri + 1} de ${R.length}:</b> haz que el robot <b>mire hacia la bandera</b> 🚩.`;
    $('.mk0', host).innerHTML = [0, 90, 180, 270].map(g => `<text x="${Math.sin(g * Math.PI / 180) * 104}" y="${-Math.cos(g * Math.PI / 180) * 104 + 4}" font-size="11" text-anchor="middle">${g}°</text>`).join(''); };
  $('.gv', host).onclick = () => { const o = $('.rr', host); o.className = 'res-box bad rr'; o.textContent = '❓ «Gira»… ¿hacia qué lado? ¿cuántos grados? Un robot necesita los dos datos.'; sh(o); };
  $('.gg', host).onclick = async () => { if (busy) return; const o = $('.rr', host), deg = $('.gd', host).value; if (deg === '') { o.className = 'res-box bad rr'; o.textContent = '❓ Falta el número de grados.'; sh(o); return; }
    busy = true; ang += +$('.gs', host).value * (+deg); bot.style.transform = `rotate(${ang}deg)`; await sleep(900); const net = ((ang % 360) + 360) % 360, want = ((R[ri] % 360) + 360) % 360;
    if (net === want) { o.className = 'res-box ok rr'; o.textContent = `✅ ¡Mira a la bandera! Giró ${Math.abs(ang)}° hacia la ${ang > 0 ? 'derecha' : 'izquierda'}.`; tone(880, 100); ri++; if (ri >= R.length) { finish(); busy = false; return; } await sleep(1500); setup(); o.className = 'res-box info rr'; o.textContent = 'Nueva bandera.'; }
    else { o.className = 'res-box bad rr'; o.textContent = `🔎 Quedó mirando a ${net}°. La bandera está a ${want}°. Puedes seguir girando desde aquí.`; sh(o); }
    busy = false; };
  setup();
};

/* 6 · cuánto tiempo: v = d / t */
VIZ.distancia_tiempo = (host, finish, d) => {
  const R = [{ d: 60, v: 20 }, { d: 100, v: 25 }, { d: 45, v: 30 }]; let ri = 0, busy = false;
  host.insertAdjacentHTML('beforeend', `<div class="stage"><p class="dt2"></p><div class="trk long"><div class="tbot" style="left:0">🤖</div><div class="tflag">🚩</div></div><div class="row" style="margin-top:10px"><label>Velocidad: <b class="vv"></b> cm/s</label><label>Tiempo (segundos) <input type="number" class="tt" min="0" step="0.5" style="width:84px" placeholder="?"></label><button class="btn sm tg2" type="button">▶ Avanzar ese tiempo</button></div><div class="code-line cd2"></div><div class="res-box rr"></div></div>`);
  const place = (p) => { $('.tbot', host).style.left = `calc(${p / 130 * 100}% - 14px)`; };
  const setup = () => { const r = R[ri]; $('.dt2', host).innerHTML = `<b>Misión ${ri + 1} de ${R.length}:</b> la bandera está a <b>${r.d} cm</b>. El robot avanza a <b>${r.v} cm por segundo</b>. ¿Cuánto tiempo debe avanzar para <b>detenerse en la bandera</b>?`; $('.vv', host).textContent = r.v; $('.tflag', host).style.left = `calc(${r.d / 130 * 100}% - 12px)`; place(0); $('.tt', host).value = ''; $('.cd2', host).textContent = 'distancia = velocidad × tiempo   →   tiempo = distancia ÷ velocidad'; };
  $('.tg2', host).onclick = async () => { if (busy) return; const o = $('.rr', host), t = $('.tt', host).value; if (t === '') { o.className = 'res-box bad rr'; o.textContent = '❓ ¿Cuánto tiempo? Sin ese dato el robot no sabe cuándo parar.'; sh(o); return; }
    busy = true; const r = R[ri], dist = r.v * +t; place(0); await sleep(250); const sd = Math.min(dist, 125); const steps = 20; for (let k = 1; k <= steps; k++) { place(sd * k / steps); await sleep(45); }
    $('.cd2', host).textContent = `${r.v} cm/s × ${t} s = ${dist} cm`;
    if (Math.abs(dist - r.d) <= 3) { o.className = 'res-box ok rr'; o.innerHTML = `✅ ¡Se detuvo en la bandera! En código: <code>SuperBitV2.motor_run_dual(...)</code> y luego <code>basic.pause(${Math.round(+t * 1000)})</code> (la pausa va en milisegundos) y <code>motor_stop_all()</code>.`; tone(880, 120); ri++; if (ri >= R.length) { finish(); busy = false; return; } await sleep(2600); setup(); o.className = 'res-box info rr'; o.textContent = 'Nueva misión.'; }
    else { o.className = 'res-box bad rr'; o.textContent = dist < r.d ? `🔎 Avanzó ${dist} cm y se quedó corto: faltaron ${r.d - dist} cm.` : `🔎 Avanzó ${dist} cm y se pasó por ${dist - r.d} cm.`; sh(o); }
    busy = false; };
  setup();
};

/* 7 · dibujar en la pantalla con coordenadas exactas */
VIZ.dibuja_orden = (host, finish, d) => {
  const R = [{ n: 'las cuatro esquinas', pts: [[0, 0], [4, 0], [0, 4], [4, 4]] }, { n: 'una carita feliz', pts: [[1, 1], [3, 1], [0, 3], [1, 4], [2, 4], [3, 4], [4, 3]] }]; let ri = 0;
  host.insertAdjacentHTML('beforeend', `<div class="stage"><p class="dt3"></p><div class="row" style="align-items:flex-start;gap:18px"><div><b>Debe quedar así:</b><div class="mbgrid sm tgt"></div></div><div><b>Tu dibujo:</b><div class="mbgrid sm mine"></div></div><div style="flex:1;min-width:240px"><b>Escribe una orden por línea:</b><textarea class="ta3" rows="8" spellcheck="false" placeholder="led.plot(0, 0)&#10;led.plot(4, 0)"></textarea><button class="btn sm dgo" type="button">▶ Dibujar</button></div></div><div class="res-box rr"></div></div>`);
  const grid = (el, set) => { el.innerHTML = Array.from({ length: 25 }, (_, i) => `<span class="px2 ${set.has(i) ? 'on' : ''}"></span>`).join(''); };
  const key = (x, y) => y * 5 + x;
  const setup = () => { $('.dt3', host).innerHTML = `<b>Misión ${ri + 1} de ${R.length}:</b> dibuja <b>${R[ri].n}</b>. Recuerda: <code>led.plot(x, y)</code> — x es la columna (0 a 4, de izquierda a derecha) y y es la fila (0 a 4, de arriba hacia abajo).`; grid($('.tgt', host), new Set(R[ri].pts.map(p => key(p[0], p[1])))); grid($('.mine', host), new Set()); $('.ta3', host).value = ''; };
  $('.dgo', host).onclick = () => { const o = $('.rr', host), lines = $('.ta3', host).value.split('\n').map(s => s.trim()).filter(Boolean), mine = new Set(); let bad = null;
    for (const ln of lines) { const m = ln.match(/^led\.plot\(\s*(\d+)\s*,\s*(\d+)\s*\)$/); if (!m) { bad = ln; break; } const x = +m[1], y = +m[2]; if (x > 4 || y > 4) { bad = ln + '  (x e y van de 0 a 4)'; break; } mine.add(key(x, y)); }
    grid($('.mine', host), mine); if (bad) { o.className = 'res-box bad rr'; o.innerHTML = `❓ No entiendo esta orden: <code>${esc(bad)}</code>. Debe verse así: <code>led.plot(2, 3)</code>`; sh(o); return; }
    const want = new Set(R[ri].pts.map(p => key(p[0], p[1]))); const miss = [...want].filter(k => !mine.has(k)).length, extra = [...mine].filter(k => !want.has(k)).length;
    if (!miss && !extra) { o.className = 'res-box ok rr'; o.textContent = '🎨 ¡Idéntico! Cada luz necesita su x y su y exactos.'; tone(880, 100); ri++; if (ri >= R.length) { finish(); return; } setTimeout(() => { setup(); o.className = 'res-box info rr'; o.textContent = 'Nuevo dibujo.'; }, 1800); }
    else { o.className = 'res-box bad rr'; o.textContent = `🔎 Faltan ${miss} luz(ces) y sobran ${extra}. Compara tu dibujo con el modelo.`; sh(o); } };
  setup();
};

/* 8 · paso a paso: cómo cambian las variables */
VIZ.traza = (host, finish, d) => {
  const c = d.cfg, lines = c.code.split('\n'); let k = -1;
  host.insertAdjacentHTML('beforeend', `<div class="stage"><div class="tz"><div><b>Programa</b><pre class="code tzc"></pre></div><div><b>Las cajas (variables)</b><div class="tzv boxes"></div><b>Pantalla</b><pre class="out tzo" style="display:block;min-height:34px"></pre></div></div><div class="res-box info tzn">Presiona «Siguiente paso» para ejecutar el programa línea por línea, como lo haría el computador.</div><div class="row"><button class="btn sec sm tpv" type="button">◀ Anterior</button><button class="btn teal sm tnx" type="button">Siguiente paso ▶</button><button class="btn sec sm trs" type="button">⏮ Empezar de nuevo</button></div></div>`);
  const draw = () => { const st = c.steps[k]; $('.tzc', host).innerHTML = lines.map((ln, i) => `<span class="${st && st.l === i ? 'hl' : ''}">${esc(ln) || ' '}</span>`).join('\n');
    const v = st ? st.v : {}; $('.tzv', host).innerHTML = Object.keys(v).map(n => `<div class="vbox"><div class="lab">${esc(n)}</div><div class="in">${esc(String(v[n]))}</div></div>`).join('') || '<span class="note">(todavía no hay cajas)</span>';
    $('.tzo', host).textContent = st ? (st.o || '') : ''; if (st) $('.tzn', host).innerHTML = `<b>Paso ${k + 1} de ${c.steps.length}.</b> ${st.n}`; };
  $('.tnx', host).onclick = () => { if (k < c.steps.length - 1) { k++; draw(); tone(400 + k * 30, 60); } if (k === c.steps.length - 1) finish(); };
  $('.tpv', host).onclick = () => { if (k > 0) { k--; draw(); } }; $('.trs', host).onclick = () => { k = -1; draw(); $('.tzn', host).textContent = 'Presiona «Siguiente paso».'; };
  draw();
};

/* ═════════ navegación ═════════ */
function buildNav() {
  const side = $('#side'), sel = $('#navsel'); side.innerHTML = ''; sel.innerHTML = '';
  const item = (id, label, extra, num) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'nv'; b.dataset.v = id; if (extra) b.dataset.l = id; b.innerHTML = (extra ? `<b>${num || id.slice(1)}</b>` : '<b>•</b>') + `<span>${label}</span>` + (extra ? '<small></small>' : ''); b.onclick = () => { location.hash = id; }; side.appendChild(b); const o = document.createElement('option'); o.value = id; o.textContent = label; sel.appendChild(o); };
  const h = t => { const e = document.createElement('h4'); e.textContent = t; side.appendChild(e); const g = document.createElement('optgroup'); g.label = t; sel.appendChild(g); };
  item('home', 'Inicio');
  LEVELS.forEach((lv, i) => { h(lv[0] + ' · ' + lv[1]); LESSONS.filter(l => l.lv === i).forEach(l => item(l.id, l.t, true, l.num)); });
  h('Extras'); item('glosario', 'Glosario con ejemplos'); item('catalog', 'Catálogo de bloques'); item('lab', 'Laboratorio libre'); item('cert', 'Mi certificado');
  sel.onchange = () => { location.hash = sel.value; };
}
function route() {
  const id = (location.hash || '#home').slice(1), l = LESSONS.find(x => x.id === id);
  if (l) lessonView(l); else if (id === 'glosario') glosarioView(); else if (id === 'catalog') catalogView(); else if (id === 'lab') labView(); else if (id === 'cert') certView(); else homeView();
  $$('.nv').forEach(b => b.classList.toggle('on', b.dataset.v === (l || ['glosario', 'catalog', 'lab', 'cert'].includes(id) ? id : 'home')));
  $('#navsel').value = (l || ['glosario', 'catalog', 'lab', 'cert'].includes(id)) ? id : 'home';
  refreshProgress(); window.scrollTo({ top: 0 });
}
buildNav(); window.addEventListener('hashchange', route); route(); Engine.warm();
</script>
